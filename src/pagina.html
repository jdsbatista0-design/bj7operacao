 ['compromissos','Compromissos assumidos ontem','Quem prometeu o quê, e para quando.'],
 ['travas','Travas que dependem de mim','Decisões que só você destrava.'],
 ['notas','Anotações livres',''],
];
let dados = {};

function fechamentoDia(dia){
 const A = D.ativ.filter(x=>x.q===dia && ativNoEscopo(x));
 return NOMES.filter(ativo).map(n=>{
  const meus = A.filter(x=>x.a===n);
  return {n,
   trab: new Set(meus.filter(x=>x.i).map(x=>x.i)).size,
   cont: meus.filter(x=>REAL.includes(x.t)).length,
   ganhos: D.resultado.filter(x=>noEscopo(x) && x.d===n && x.r==='ganho' && x.q===dia).length,
   perdidos: D.resultado.filter(x=>noEscopo(x) && x.d===n && x.r==='perdido' && !x.op && x.q===dia).length};
 });
}

function blocoPontos(m, ini, fim, rotulo, campoMeta){
 const linhas = NOMES.filter(ativo).map(n=>({n, ...pontosDe(n, ini, fim),
   meta: metaPontos(n)[campoMeta] || 0}));
 const max = Math.max(1, ...linhas.map(x=>Math.max(x.total, x.meta)));
 const bx = el('<div></div>');
 linhas.forEach(x=>{
  const pct = x.meta ? Math.min(x.total/x.meta*100, 100) : 0;
  const falta = Math.max(x.meta - x.total, 0);
  linha(bx,
   '<div class="hd"><span class="nm">'+esc(x.n)+'</span>'
    +'<span class="stat num'+(x.meta && x.total<x.meta ? ' warn':'')+'">'+nf(x.total)+' pts'
    +(x.meta? ' de '+nf(x.meta) : '')+'</span></div>'
   +'<div class="sub">'+(x.meta
      ? (falta? 'faltam '+nf(falta)+' pontos' : 'meta batida')
      : 'sem meta definida para '+rotulo)
    +' · '+x.ativ+' atividades'+(x.vendas? ' · '+x.vendas+' venda'+(x.vendas>1?'s':'') : '')+'</div>'
   +'<div class="bar"><i class="'+(x.meta && x.total>=x.meta ? '' : 'dim')
    +'" style="width:'+Math.max(x.meta? pct : x.total/max*100, 1.5)+'%"></i></div>',
   host => {
    const itens = Object.entries(x.porCanal).sort((a,b)=>b[1].p-a[1].p);
    if(!itens.length){ host.append(el('<div class="empty">Nada registrado no período.</div>')); return; }
    const cv = el('<div style="margin-top:10px"></div>');
    cv.append(el('<div class="conv conv5"><span class="mini">De onde vêm os pontos</span>'
     +'<span class="h">Qtd</span><span class="h">Vale</span><span class="h">Pontos</span>'
     +'<span class="h">%</span></div>'));
    const pc = {...pontosCfg(), 'Venda':extraCfg().venda, 'Tarefa no prazo':extraCfg().tarefaNoPrazo};
    itens.forEach(([k,v])=>{
     cv.append(el('<div class="conv conv5"><span class="nm">'+esc(k)+'</span>'
      +'<span class="v">'+v.n+'</span><span class="v">'+(pc[k]??0)+'</span>'
      +'<span class="v">'+nf(v.p)+'</span>'
      +'<span class="v">'+(x.total? Math.round(v.p/x.total*100):0)+'%</span></div>'));
    });
    host.append(cv);
   });
 });
 m.append(bx);
 return linhas;
}

function campoLivre(m, k, rot, ph){
 m.append(el('<label for="f-'+k+'">'+rot+(ph?'<i>'+esc(ph)+'</i>':'')+'</label>'));
 const ta = el('<textarea id="f-'+k+'" rows="3"></textarea>');
 ta.value = dados[k]||''; ta.oninput = () => { dados[k]=ta.value; salvar(); };
 m.append(ta);
}

/* Estrutura do Level 10 Meeting (EOS/Traction), adaptada à matinal da casa:
   abertura, placar, objetivos, notícias, combinados, problemas e nota.
   O que faz a reunião funcionar não são os blocos: é que problema vira
   combinado com dono e prazo, e que a reunião se avalia no fim.            */
const issues = () => {
 if(REUNIOES_EXTERNAS()){
  const lista = (D.trelloReunioes.reunioes||[]).filter(r=>/problema|pauta|impedimento/i.test(r.tipo||''));
  return lista.map(r=>({id:r.id, texto:r.assunto, criado:r.data||HOJE, resolvido:false,
    prioridade:(r.etiquetas||[]).some(e=>/urgent|alta/i.test(e))?1:0, link:r.link}));
 }
 return (dados.issues||[]).filter(i => EMP.id==='grupo' || i.emp===EMP.id);
};
const issuesAbertas = () => issues().filter(i=>!i.resolvido);

function viewMatinal(m){
 const [si, sf] = semanaAtual(), [mi, mf] = mesAtual();
 m.append(el('<p class="lede">Sempre a mesma ordem, sempre o mesmo tempo. O bloco que decide a reunião '
  +'é o de <b>problemas</b>: nada sai dali sem virar combinado com dono e prazo.</p>'));

 /* 1 — abertura */
 m.append(el('<h2>1 · Abertura <span class="mini">5 min</span></h2>'));
 m.append(el('<p class="lede">Uma boa notícia de cada um, pessoal ou do trabalho. Serve para a reunião '
  +'não começar cobrando.</p>'));
 campoLivre(m,'dinamica','Dinâmica de hoje','qual foi');
 campoLivre(m,'boasNoticias','Boas notícias da rodada','');

 /* 2 — placar */
 m.append(el('<h2>2 · Placar <span class="mini">5 min</span></h2>'));
 m.append(el('<p class="lede">Pontos da semana contra a meta. Verde é no rumo, vermelho é fora — '
  +'e fora do rumo vira problema no bloco 6, não discussão aqui.</p>'));
 const placar = blocoPontos(m, si, sf, 'a semana', 'semana');
 const foraDoRumo = placar.filter(x=>x.meta && x.total < x.meta);
 if(foraDoRumo.length) m.append(el('<p class="lede"><b>'+foraDoRumo.length
   +(foraDoRumo.length===1?' pessoa está':' pessoas estão')+' fora do rumo:</b> '
   + foraDoRumo.map(x=>esc(x.n)).join(', ')+'. Leve para o bloco de problemas.</p>'));

 /* 3 — objetivos */
 m.append(el('<h2>3 · Objetivos <span class="mini">5 min</span></h2>'));
 const objs = (dados.okrs||[]).filter(o=>(o.objetivo||'').trim() && NOMES.filter(ativo).includes(o.quem));
 if(!objs.length) m.append(el('<div class="empty">Nenhum objetivo definido. '
   +'Sem objetivo, a matinal vira só rotina.</div>'));
 else {
  const bx = el('<div></div>');
  objs.forEach(o=>{
   const atras = o.prazo && o.prazo < HOJE && o.status!=='concluido';
   const noRumo = o.status==='concluido' || (o.progresso||0) >= 50;
   bx.append(el('<div class="conv" style="grid-template-columns:1fr auto">'
    +'<div><span class="nm">'+esc(o.objetivo)+'</span><div class="sub">'+esc(o.quem)
    +(o.kr? ' · '+esc(o.kr):'')+(o.prazo? ' · até '+dbr(o.prazo):'')+'</div></div>'
    +'<span class="'+(noRumo && !atras ? 'mini':'warn')+'">'+(o.progresso||0)+'%'
    +(atras? ' · vencido':'')+'</span></div>'));
  });
  m.append(bx);
 }

 /* 4 — notícias */
 m.append(el('<h2>4 · Notícias <span class="mini">5 min</span></h2>'));
 m.append(el('<p class="lede">Cliente e time. Só o fato, sem discussão — o que precisar virar assunto '
  +'vai para problemas.</p>'));
 campoLivre(m,'noticiasCliente','De cliente','ganhou, perdeu, reclamou, elogiou');
 campoLivre(m,'noticiasTime','Do time','entrou, saiu, férias, aniversário');

 /* 5 — combinados da rodada anterior */
 const ab = compromissosAbertos();
 const pendMod = pendencias().filter(x=>x.quando && x.quando <= HOJE);
 const totalComp = (dados.reunioes||[]).flatMap(r=>r.comp||[]).length;
 const feitosComp = (dados.reunioes||[]).flatMap(r=>r.comp||[]).filter(c=>c.feito).length;
 const taxa = totalComp ? Math.round(feitosComp/totalComp*100) : null;
 m.append(el('<h2>5 · Combinados <span class="mini">5 min</span></h2>'));
 m.append(el('<p class="lede">'+(taxa===null
   ? 'Nenhum combinado registrado ainda.'
   : '<b>'+taxa+'%</b> dos combinados foram concluídos. Abaixo de 90% o problema não é o time, '
     +'é o que está sendo combinado: ou demais, ou sem dono, ou sem prazo.')+'</p>'));
 if(ab.length){
  const bx = el('<div></div>');
  ab.forEach(x=>{
   const atras = x.c.quando && x.c.quando < HOJE;
   const l = el('<div class="conv" style="grid-template-columns:1fr auto auto;gap:10px">'
    +'<div><span class="nm">'+esc(x.c.oque||'(sem descrição)')+'</span>'
    +'<div class="sub">'+esc(x.c.quem||'<span class="warn">sem dono</span>')+'</div></div>'
    +'<span class="'+(atras?'warn':'mini')+'">'+(x.c.quando? dbr(x.c.quando):'sem prazo')+'</span>'
    +'<button class="btn ghost sm">Feito</button></div>');
   l.querySelector('button').onclick = () => { x.c.feito = true; salvar(); render(); };
   bx.append(l);
  });
  m.append(bx);
 }
 if(pendMod.length){
  m.append(el('<h4 class="sec">Vencido nos módulos</h4>'));
  const bx2 = el('<div></div>');
  pendMod.forEach(x=> bx2.append(el('<div class="conv" style="grid-template-columns:1fr auto">'
   +'<div><span class="nm">'+esc(x.o)+'</span><div class="sub">'+esc(x.onde)
   +(x.quem? ' · '+esc(x.quem):'')+'</div></div><span class="warn">'+dbr(x.quando)+'</span></div>')));
  m.append(bx2);
 }

 /* 6 — problemas, o coração da reunião */
 m.append(el('<h2>6 · Problemas <span class="mini">o resto do tempo</span></h2>'));
 m.append(el('<p class="lede">Os problemas vêm da lista <b>Problemas</b> do quadro de reuniões no '
  +'Trello. Escolha os três que mais doem e resolva um de cada vez — resolver significa virar '
  +'combinado, que é um item de checklist no cartão.</p>'));
 const abertas = issuesAbertas().sort((a,b)=> (b.prioridade||0)-(a.prioridade||0)
   || (a.criado < b.criado ? -1 : 1));
 const bxI = el('<div style="margin-top:12px"></div>');
 if(!abertas.length) bxI.append(el('<div class="empty">Nenhum problema na lista. '
   +'Se a reunião não tem problema, ou está tudo perfeito ou ninguém está falando.</div>'));
 abertas.forEach((it,idx)=>{
  const li = el('<div class="issue'+(idx<3?' top3':'')+'">'
   +'<button class="pri" title="Priorizar">'+(it.prioridade? '★':'☆')+'</button>'
   +'<div class="ic"><span class="nm">'+esc(it.texto)+'</span>'
   +'<div class="sub">'+(idx<3? 'entre os três da rodada · ':'')+'aberto desde '+dbr(it.criado)
   +(it.idade? '' : '')+' · '+dif(it.criado, HOJE)+' dias</div></div>'
   +'<button class="btn ghost sm" data-res>Resolvido</button></div>');
  if(REUNIOES_EXTERNAS()){
   li.querySelector('.pri').onclick = () => { if(it.link) window.open(it.link,'_blank'); };
   const b = li.querySelector('[data-res]');
   b.textContent = 'Abrir';
   b.onclick = () => { if(it.link) window.open(it.link,'_blank'); };
   bxI.append(li); return;
  }
  li.querySelector('.pri').onclick = () => { it.prioridade = it.prioridade? 0 : 1; salvar(); render(); };
  li.querySelector('[data-res]').onclick = () => {
   const t = prompt('O que ficou combinado para resolver isso? Deixe vazio para só marcar resolvido.');
   if(t){
    dados.reunioes = dados.reunioes || [];
    let r = dados.reunioes.find(z=>z.data===HOJE && z.tipo==='operacional');
    if(!r){ r = novaReuniao('operacional'); r.assunto='Matinal'; dados.reunioes.unshift(r); }
    r.comp = r.comp || [];
    r.comp.push({oque:t, quem:'', quando:'', feito:false});
   }
   it.resolvido = HOJE; salvar(); render();
  };
  bxI.append(li);
 });
 m.append(bxI);
 const resolvidas = issues().filter(i=>i.resolvido);
 if(resolvidas.length) m.append(el('<p class="mini" style="margin-top:10px">'+resolvidas.length
   +' problema'+(resolvidas.length>1?'s':'')+' já resolvido'+(resolvidas.length>1?'s':'')+'.</p>'));

 /* 7 — encerramento */
 m.append(el('<h2>7 · Encerramento <span class="mini">5 min</span></h2>'));
 campoLivre(m,'recado','O que precisa ser dito para quem não estava','a mensagem que sobe e desce');
 campoLivre(m,'aprendizados','O que aprendemos','');
 m.append(el('<label for="nota">Nota da reunião, de 1 a 10<i>abaixo de 8, diga o que faltou</i></label>'));
 const nt = el('<input type="number" min="1" max="10" class="search" id="nota" style="max-width:110px">');
 nt.value = dados.notaReuniao || '';
 nt.oninput = () => { dados.notaReuniao = nt.value; salvar(); };
 m.append(nt);
 campoLivre(m,'notaPorque','Por que essa nota','');

 /* metas e pesos */
 m.append(el('<h2>Metas de pontos</h2>'));
 NOMES.filter(ativo).forEach(n=>{
  const mt = metaPontos(n);
  const row = el('<div class="meta-row"><div><span class="nm">'+esc(n)+'</span>'
   +'<div class="sub">semana · mês</div></div>'
   +'<input type="number" min="0" inputmode="numeric" style="max-width:84px" '
   +'aria-label="Meta semanal de '+esc(n)+'">'
   +'<input type="number" min="0" inputmode="numeric" style="max-width:84px" '
   +'aria-label="Meta mensal de '+esc(n)+'"></div>');
  const [a,b] = row.querySelectorAll('input');
  a.value = mt.semana||''; b.value = mt.mes||'';
  const grava = () => { dados.metasPontos = dados.metasPontos || {};
   dados.metasPontos[n] = {semana:+a.value||0, mes:+b.value||0}; salvar(); };
  a.oninput = grava; b.oninput = grava;
  m.append(row);
 });
 m.append(el('<h2>Quanto vale cada coisa</h2>'));
 const pc = pontosCfg(), ex = extraCfg();
 Object.keys(pc).forEach(k=>{
  m.append(el('<label for="pt-'+k+'">'+esc(k)+'</label>'));
  const i = el('<input type="number" class="search" id="pt-'+k+'" style="max-width:120px">');
  i.value = pc[k];
  i.oninput = () => { dados.pontos = dados.pontos || {};
   dados.pontos.canais = {...pontosCfg(), [k]: +i.value||0}; salvar(); };
  m.append(i);
 });
 [['venda','Venda fechada'],['tarefaNoPrazo','Tarefa concluída no prazo']].forEach(([k,rot])=>{
  m.append(el('<label for="px-'+k+'">'+rot+'</label>'));
  const i = el('<input type="number" class="search" id="px-'+k+'" style="max-width:120px">');
  i.value = ex[k];
  i.oninput = () => { dados.pontos = dados.pontos || {};
   dados.pontos.extra = {...extraCfg(), [k]: +i.value||0}; salvar(); };
  m.append(i);
 });

 const acts = el('<div class="actions no-print">'
  +'<button class="btn" id="gerar">Abrir apresentação</button>'
  +'<span class="saved" id="saved"></span></div>');
 m.append(acts);
 acts.querySelector('#gerar').onclick = imprimir;
}

let tmr;
function salvar(){
 clearTimeout(tmr);
 tmr = setTimeout(async () => {
  if(MODO === 'servidor') return salvarNoServidor();
  if(MODO === 'nenhum') return avisarFalhaAoSalvar();
  /* O aviso "Salvo" só existe na Matinal, mas a gravação vale para todas as abas:
     PDI, alertas, reuniões, registros e pontos também passam por aqui. */
  const s = document.getElementById('saved');
  try { await window.storage.set('matinal:campos', JSON.stringify(dados));
        if(s) s.textContent = 'Salvo'; }
  catch(e){ if(s) s.textContent = 'Não consegui salvar — copie o texto antes de fechar';
            else avisarFalhaAoSalvar(); return; }
  setTimeout(()=>{ if(s) s.textContent=''; }, 2000);
 }, 600);
}
async function salvarNoServidor(){
 const s = document.getElementById('saved');
 try {
  const r = await fetch('/estado', {method:'PUT', headers:{'content-type':'application/json'},
    body: JSON.stringify({rev: REV, dados})});
  if(r.status === 409){
   const j = await r.json();
   REV = j.rev;
   avisarConflito(j);
   return;
  }
  const j = await r.json();
  REV = j.rev;
  if(s) s.textContent = 'Salvo para todos';
  setTimeout(()=>{ if(s) s.textContent=''; }, 2000);
 } catch(e){
  if(s) s.textContent = 'Não consegui salvar';
  else avisarFalhaAoSalvar();
 }
}

function avisarConflito(j){
 const n = el('<div class="mask"><div class="modal" role="dialog" aria-modal="true">'
  +'<h3>Outra pessoa salvou antes</h3>'
  +'<p class="lede">Alguém alterou os dados enquanto você editava'
  + (j.por? ' ('+esc(j.por)+')' : '') + '. Para não apagar o trabalho dela, '
  +'nada foi gravado. Recarregue para ver a versão dela e refaça sua alteração.</p>'
  +'<div class="actions"><button class="btn" data-r>Recarregar</button>'
  +'<button class="btn ghost" data-x>Depois</button></div></div></div>');
 n.querySelector('[data-r]').onclick = () => location.reload();
 n.querySelector('[data-x]').onclick = () => n.remove();
 document.body.append(n);
}

let jaAvisou = false;
function avisarFalhaAoSalvar(){
 if(jaAvisou) return; jaAvisou = true;
 const n = el('<div class="mask"><div class="modal" role="dialog" aria-modal="true">'
  +'<h3>Não consegui salvar</h3><p class="lede">O que você escreveu <b>não foi gravado</b> e vai '
  +'sumir ao recarregar a página. Copie o texto antes de fechar.</p>'
  +'<div class="actions"><button class="btn" data-x>Entendi</button></div></div></div>');
 n.querySelector('[data-x]').onclick = () => { n.remove(); jaAvisou = false; };
 document.body.append(n);
}

function corpoApresentacao(){
 const [si, sf] = semanaAtual(), [mi, mf] = mesAtual();
 let h = '<h1>Matinal — '+esc(EMP.nome)+'</h1><p class="sub">'+dbr(HOJE)+'</p>';

 if((dados.dinamica||'').trim() || (dados.dinamicaNotas||'').trim()){
  h += '<h2>Dinâmica</h2>';
  if((dados.dinamica||'').trim()) h += '<p><b>'+esc(dados.dinamica)+'</b></p>';
  if((dados.dinamicaNotas||'').trim()) h += '<p>'+esc(dados.dinamicaNotas)+'</p>';
 }

 const ultDia = [...new Set(D.ativ.filter(ativNoEscopo).map(x=>x.q))].sort().pop();
 if(ultDia){
  h += '<h2>Rotina — fechamento de '+dbr(ultDia)+'</h2>'
   +'<table><thead><tr><th>Pessoa</th><th class="r">Negócios</th><th class="r">Contatos</th>'
   +'<th class="r">Ganhos</th><th class="r">Pontos</th></tr></thead><tbody>'
   + fechamentoDia(ultDia).map(f=>'<tr><td>'+f.n+'</td><td class="r">'+f.trab+'</td><td class="r">'
      +f.cont+'</td><td class="r">'+f.ganhos+'</td><td class="r">'
      +nf(pontosDe(f.n, ultDia, ultDia).total)+'</td></tr>').join('')
   + '</tbody></table>';
 }

 const tabelaPts = (ini,fim,campo,rot) => {
  const l = NOMES.filter(ativo).map(n=>({n, ...pontosDe(n,ini,fim), meta:metaPontos(n)[campo]||0}));
  if(!l.some(x=>x.total || x.meta)) return '';
  return '<h2>Resultados — '+rot+'</h2>'
   +'<table><thead><tr><th>Pessoa</th><th class="r">Pontos</th><th class="r">Meta</th>'
   +'<th class="r">Falta</th><th class="r">Atividades</th><th class="r">Vendas</th></tr></thead><tbody>'
   + l.map(x=>'<tr><td>'+x.n+'</td><td class="r">'+nf(x.total)+'</td><td class="r">'
      +(x.meta? nf(x.meta):'—')+'</td><td class="r">'
      +(x.meta? nf(Math.max(x.meta-x.total,0)) : '—')+'</td><td class="r">'+x.ativ
      +'</td><td class="r">'+x.vendas+'</td></tr>').join('')
   + '</tbody></table>';
 };
 h += tabelaPts(si, sf, 'semana', 'semana de '+dbr(si)+' a '+dbr(sf));
 h += tabelaPts(mi, mf, 'mes', 'mês de '+(MES_LONGO[mi.slice(5,7)]||''));

 const q = V.negocios.filter(x=>x.temp==='quente');
 if(q.length){
  h += '<h2>Quentes</h2><table><thead><tr><th>Negócio</th><th>Cliente</th><th>Com quem</th>'
   +'<th class="r">Parado</th></tr></thead><tbody>'
   + q.map(x=>'<tr><td>'+esc(x.t)+'</td><td>'+esc(x.cl||'—')+'</td><td>'+esc(x.d)
     +'</td><td class="r">'+x.p+' d</td></tr>').join('') + '</tbody></table>';
 }

 if((dados.aprendizados||'').trim() || (dados.ajustes||'').trim()){
  h += '<h2>Aprendizados</h2>';
  if((dados.aprendizados||'').trim()) h += '<p>'+esc(dados.aprendizados)+'</p>';
  if((dados.ajustes||'').trim()) h += '<p><span class="mini">O que muda</span><br>'
    +esc(dados.ajustes)+'</p>';
 }

 const ab = compromissosAbertos();
 if(ab.length || (dados.compromissos||'').trim() || (dados.travas||'').trim()){
  h += '<h2>Compromissos</h2>';
  if(ab.length) h += '<table><thead><tr><th>O quê</th><th>Quem</th><th>Prazo</th></tr></thead><tbody>'
   + ab.map(x=>'<tr><td>'+esc(x.c.oque||'—')+'</td><td>'+esc(x.c.quem||'—')+'</td><td>'
     +(x.c.quando? dbr(x.c.quando):'—')+'</td></tr>').join('') + '</tbody></table>';
  if((dados.compromissos||'').trim()) h += '<p>'+esc(dados.compromissos)+'</p>';
  if((dados.travas||'').trim()) h += '<p><span class="mini">Travas</span><br>'+esc(dados.travas)+'</p>';
 }

 const pend = pendencias().filter(x=>x.quando && x.quando <= HOJE);

     +'</td><td>'+dbr(x.quando)+'</td></tr>').join('') + '</tbody></table>';

 const vis = visiveis();

function imprimir(){

  +'<div class="doc">'+corpoApresentacao()+'</div></div>');
 const fecha = () => { tela.remove(); document.removeEventListener('keydown', onEsc); };
 const onEsc = e => { if(e.key==='Escape') fecha(); };
 document.addEventListener('keydown', onEsc);
 tela.querySelector('[data-x]').onclick = fecha;

 tela.querySelector('[data-copy]').onclick = async e => {
  try { await navigator.clipboard.writeText(apresentacaoTexto());
        e.target.textContent = 'Copiado'; }

  setTimeout(()=> e.target.textContent = 'Copiar texto', 2200);
 };

 '07':'jul','08':'ago','09':'set','10':'out','11':'nov','12':'dez'};
const ATALHOS = [['hoje','Hoje'],['ontem','Ontem'],['7','7 dias'],['30','30 dias'],['tudo','Tudo']];
function montarPeriodo(){
 const box = document.getElementById('periodo');
 const seg = el('<div class="seg">' + ATALHOS.map(([k,r])=>'<button data-k="'+k+'">'+r+'</button>').join('') + '</div>');
 const mes = el('<select class="selmes" aria-label="Mês"><option value="">Mês…</option>'
   + D.meses.slice().reverse().map(m=>'<option value="'+m+'">'+MES_NOME[m.slice(5)]+'/'+m.slice(0,4)+'</option>').join('')
   + '</select>');
 const dts = el('<div class="datas"><input type="date" id="pi" aria-label="Início"> até '
   +'<input type="date" id="pf" aria-label="Fim"></div>');
 const res = el('<span class="res" id="pres"></span>');
 box.append(seg, mes, dts, res);
 const pi = dts.querySelector('#pi'), pf = dts.querySelector('#pf');
 pi.min = pf.min = D.janela.ini; pi.max = pf.max = D.janela.fim;

 const aplicar = (ini, fim, rot, atalho, selMes) => {
  PER = {ini, fim, rot};
  pi.value = ini; pf.value = fim; mes.value = selMes || '';
  seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===atalho));
  calcular();
  const n = dif(ini,fim)+1;
  res.textContent = n + (n>1?' dias, ':' dia, ') + V.A.length + ' atividades';
  const er = document.getElementById('eres');
  if(er) er.textContent = nf(V.negocios.length) + ' negócios · ' + NOMES.length
    + (NOMES.length===1?' pessoa':' pessoas');
  render();
 };
 const doMes = m => {
  const fimM = new Date(+m.slice(0,4), +m.slice(5), 0).toISOString().slice(0,10);
  aplicar(m+'-01', fimM > D.janela.fim ? D.janela.fim : fimM,
    MES_NOME[m.slice(5)]+' de '+m.slice(0,4), '', m);
 };
 seg.querySelectorAll('button').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if(k==='tudo') aplicar(D.janela.ini, D.janela.fim,
    'de '+dbr(D.janela.ini)+' a '+dbr(D.janela.fim), 'tudo');
  else if(k==='hoje') aplicar(HOJE, HOJE, 'hoje, '+dbr(HOJE), 'hoje');
  else if(k==='ontem'){ const o = recua(2); aplicar(o, o, 'ontem, '+dbr(o), 'ontem'); }
  else { const i = recua(+k); aplicar(i < D.janela.ini ? D.janela.ini : i, D.janela.fim, 'últimos '+k+' dias', k); }
 });
 mes.onchange = () => { if(mes.value) doMes(mes.value); };
 [pi,pf].forEach(x => x.onchange = () => {
  if(!pi.value || !pf.value || pi.value > pf.value) return;
  aplicar(pi.value, pf.value,
    pi.value.slice(8,10)+'/'+pi.value.slice(5,7)+' a '+pf.value.slice(8,10)+'/'+pf.value.slice(5,7), '');
 });
 doMes(D.meses[D.meses.length-1]);
}

function linha(host, html, preencher){
 const b = el('<button class="row" aria-expanded="false">'+html+'</button>');
 host.append(b);
 b.onclick = () => {
  const aberto = b.getAttribute('aria-expanded')==='true';
  host.querySelectorAll('.panel').forEach(p=>p.remove());
  host.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-expanded','false'));
  if(aberto) return;
  b.setAttribute('aria-expanded','true');
  const p = el('<div class="panel"></div>');
  b.after(p); preencher(p);
 };
}

/* Onde o que as pessoas escrevem fica guardado.
   Servido pelo Worker: vai para o servidor, e todo mundo vê o mesmo.
   Aberto como arquivo: cai no armazenamento do navegador, só para quem abriu. */
/* Onde o que as pessoas escrevem é gravado. Três modos possíveis, e o painel
   precisa saber em qual está — porque escrever sem gravar é pior que não
   escrever: você acha que registrou e não registrou. */
let REV = null, MODO = 'nenhum';   /* servidor | navegador | nenhum */

async function carregarEstado(){
 try {
  const r = await fetch('/estado', {headers:{'accept':'application/json'}, credentials:'same-origin'});
  if(r.ok && (r.headers.get('content-type')||'').includes('json')){
   const j = await r.json();
   MODO = 'servidor'; REV = j.rev;
   return j.dados || {};
  }
 } catch(e){}
 if(typeof window.storage !== 'undefined' && window.storage){
  try { const r = await window.storage.get('matinal:campos');
        MODO = 'navegador';
        return r && r.value ? JSON.parse(r.value) : {}; }
  catch(e){ MODO = 'navegador'; return {}; }
 }
 MODO = 'nenhum';
 return {};
}

/* Aviso fixo no topo. Não é decoração: sem ele a pessoa digita a manhã inteira
   e perde tudo ao fechar a aba. */
function avisarModo(){
 const alvo = document.getElementById('modo');
 if(!alvo) return;
 alvo.innerHTML = '';
 if(MODO === 'servidor') return;
 if(MODO === 'navegador') return;   /* nada a avisar: a Central só lê */
 alvo.append(el('<div class="aviso grave"><b>Nada do que você escrever será salvo.</b> '
  +'O painel não conseguiu falar com o servidor, então tarefa, reunião, objetivo e lançamento '
  +'somem ao recarregar a página. Recarregue; se continuar, é o servidor que está fora.</div>'));
}

 dados = await carregarEstado();
