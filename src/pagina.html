<style>
:root{
 --paper:#F4F5F2; --card:#FFFFFF; --ink:#15181A; --soft:#666E74; --faint:#98A0A6;
 --rule:#E3E5E1; --rule2:#CBCFCA;
 --teal:#0B5F52; --teal-bg:#EAF3F1;
 --clay:#9E2B3C; --clay-bg:#FAEFF1;
 --ochre:#84590B; --ochre-bg:#FAF4E7;
 --tap:44px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.wrap{max-width:900px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);
 border-bottom:1px solid var(--rule);padding:env(safe-area-inset-top) 16px 0}
.top-in{max-width:900px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:14px 0 10px;max-height:70px;overflow:hidden;
 transition:max-height .18s ease,padding .18s ease,opacity .18s ease}
.top.compacto .brand{max-height:0;padding:0;opacity:0}
h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:650}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
.fresh{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);
 border:1px solid var(--rule2);border-radius:999px;padding:4px 10px;background:var(--card);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.dot.old{background:var(--ochre)}

/* faixas roláveis */
.periodo,nav{display:flex;gap:6px;align-items:center;overflow-x:auto;
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.periodo::-webkit-scrollbar,nav::-webkit-scrollbar{display:none}
.periodo{padding:0 0 10px}
.empresa-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 10px}
.empresa-nav button{min-height:48px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);
 color:var(--soft);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:7px 12px;text-align:left}
.empresa-nav button span{display:block;font-size:11.5px;font-weight:400;margin-top:2px;color:var(--faint)}
.empresa-nav button.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal)}
.empresa-nav button.on span{color:var(--teal)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;
 background:var(--card);flex:none}
.seg button{background:none;border:0;padding:0 14px;height:36px;font-size:13.5px;
 color:var(--soft);cursor:pointer;border-right:1px solid var(--rule2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.selmes,.selord{font:inherit;font-size:13.5px;height:36px;padding:0 30px 0 10px;flex:none;
 border:1px solid var(--rule2);border-radius:6px;background:var(--card);color:inherit;
 -webkit-appearance:none;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
   linear-gradient(135deg,var(--soft) 50%,transparent 50%);
 background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.datas{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--soft);flex:none}
.datas input{font:inherit;font-size:12.5px;height:36px;padding:0 8px;border:1px solid var(--rule2);
 border-radius:6px;background:var(--card);color:inherit}
.res{font-size:12px;color:var(--soft);white-space:nowrap;flex:none;padding-left:2px}

nav{border-top:1px solid var(--rule);margin-top:-1px}
nav button{background:none;border:0;padding:0 2px;height:var(--tap);font-size:15px;
 color:var(--soft);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
 margin-right:16px;flex:none}
nav button:last-child{margin-right:0}
nav button.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
nav .bdg{display:inline-block;min-width:17px;margin-left:5px;padding:0 5px;font-size:11px;
 line-height:16px;border-radius:8px;background:var(--clay);color:#fff;text-align:center;
 font-weight:600;vertical-align:1px}

main{padding-top:20px}
h2{font-size:14px;margin:32px 0 4px;font-weight:650;letter-spacing:-.01em}
h2:first-child{margin-top:0}
.lede{color:var(--soft);max-width:62ch;margin:6px 0 16px;font-size:14.5px}
.mini{font-size:12.5px;color:var(--soft)}
.warn{color:var(--clay)}

/* ---------- cartões ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
 border:1px solid var(--rule);border-radius:8px;overflow:hidden}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);padding:14px 14px 15px;min-height:96px;
 display:flex;flex-direction:column;justify-content:flex-start}
.kpi b{display:block;font-size:30px;font-weight:400;line-height:1;letter-spacing:-.03em}
.kpi span{display:block;font-size:12.5px;color:var(--soft);margin-top:7px;line-height:1.3}
.kpi .dl{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:3px}
.kpib{text-align:left;border:0;font:inherit;color:inherit;cursor:pointer;width:100%;
 -webkit-appearance:none;appearance:none;position:relative}
.kpib:active{background:#FAFBF9}
.kpib.on{background:var(--teal-bg)}
.kpib.on b{color:var(--teal)}
.kpib.on::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--teal)}

/* ---------- linhas expansíveis ---------- */
.row{width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);
 padding:14px 42px 14px 14px;margin-bottom:8px;cursor:pointer;display:block;
 font-size:16px;color:inherit;position:relative;border-radius:8px;min-height:var(--tap)}
.row.rk{padding-right:16px}
.row.rk::after{display:none}
.pos{display:inline-block;min-width:22px;font-size:12px;color:var(--faint);
 font-variant-numeric:tabular-nums;font-weight:400}
.row[aria-expanded=true]{border-color:var(--teal);border-radius:8px 8px 0 0;margin-bottom:0}
.row::after{content:"";position:absolute;right:17px;top:50%;width:7px;height:7px;
 border-right:1.7px solid var(--faint);border-bottom:1.7px solid var(--faint);
 transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.row[aria-expanded=true]::after{transform:translateY(-30%) rotate(225deg);border-color:var(--teal)}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.nm{font-weight:600;letter-spacing:-.01em}
.stat{font-size:13px;color:var(--soft)}
.sub{font-size:13px;color:var(--soft);margin-top:3px}
.bar{height:7px;background:#EAEBE8;margin-top:10px;position:relative;border-radius:4px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--teal)}
.bar i.dim{background:#C1C6C1}
.panel{border:1px solid var(--teal);border-top:0;background:var(--card);
 padding:2px 14px 14px;margin-bottom:8px;border-radius:0 0 8px 8px}

/* ---------- etiquetas ---------- */
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid;
 margin:0 5px 4px 0;line-height:1.5;white-space:nowrap}
.t-clay{color:var(--clay);border-color:#E9CBD1;background:var(--clay-bg)}
.t-ochre{color:var(--ochre);border-color:#E6DBBB;background:var(--ochre-bg)}
.t-gray{color:var(--soft);border-color:var(--rule2);background:#F0F1EE}
.t-teal{color:var(--teal);border-color:#BAD5CF;background:var(--teal-bg)}
.temp{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex:none}
.temp.quente{background:var(--clay)} .temp.morno{background:var(--ochre)} .temp.frio{background:#C1C6C1}

/* ---------- tabelas ---------- */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 8px}
.search{flex:1 1 160px;min-width:130px;font:inherit;font-size:15px;height:38px;padding:0 12px;
 border:1px solid var(--rule2);border-radius:6px;background:var(--card);color:inherit}
.scroll{border:1px solid var(--rule);border-radius:8px;background:var(--card);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:#FAFBF9;text-align:left;font-weight:600;color:var(--soft);font-size:12px;
 padding:9px 12px;border-bottom:1px solid var(--rule2);cursor:pointer;white-space:nowrap;user-select:none}
thead th.sorted::after{content:" ↑";color:var(--teal)}
thead th.sorted.desc::after{content:" ↓"}
td{padding:10px 12px;border-bottom:1px solid #F0F1EE;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
button.lnk{background:none;border:0;padding:0;font:inherit;font-size:15px;color:inherit;
 text-align:left;cursor:pointer;line-height:1.35;font-weight:600;
 border-bottom:1px solid var(--rule2)}
button.lnk:active{color:var(--teal)}
.sit{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
 font-size:13.5px;color:var(--soft);line-height:1.4}

<script>
const BASE = __DADOS__;
let D = BASE;
const REAL = ['Ligação','Visita','Reunião','WhatsApp'];
const MORTAS = BASE.mortas;
const HOJE = BASE.hoje;
const COB = BASE.cobertura;
/* A janela em que existe registro de atividade. Fora dela, qualquer número de
   esforço é ausência de dado, não ausência de trabalho. */
const cobreAtiv = () => PER.ini >= COB.ativDe;
const dbr = d => d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const dif = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5);
const recua = (n) => { const x = new Date(HOJE+'T12:00:00'); x.setDate(x.getDate()-n+1);
                       return x.toISOString().slice(0,10); };

/* janela ativa — recalculada em toda a tela */
let PER = {ini: D.janela.ini, fim: D.janela.fim, rot: 'agosto de 2026'};
let V = null;                       /* visão calculada */

function calcular(){
 const A = D.ativ.filter(x => x.q >= PER.ini && x.q <= PER.fim);

 NOMES = [...new Set([...EQUIPE,
   ...A.map(x=>x.a),
   ...D.negocios.filter(criadoNoPer).map(x=>x.d),
   ...D.resultado.filter(x=>noPeriodo(x)||criadoNoPer(x)).map(x=>x.d)])]
  .filter(Boolean).filter(n=>n!=='—');
 const pessoas = {};
 NOMES.forEach(n=>{
  const meus = A.filter(x=>x.a===n);
  const porDeal = {};
  meus.forEach(x=>{ if(!x.i) return;
   const o = porDeal[x.i] = porDeal[x.i] || {id:x.i, t:x.d, n:0, r:0, ult:'', tipos:{}};
   o.n++; if(REAL.includes(x.t)) o.r++;
   o.tipos[x.t] = (o.tipos[x.t]||0)+1;
   if(x.q > o.ult) o.ult = x.q;
  });
  const negocios = Object.values(porDeal).map(o=>({...o,
    tipos: Object.entries(o.tipos).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(', '),
    s: (D.ativ.find(z=>z.i===o.id && z.n) || {}).n || ''
  })).sort((a,b)=>b.n-a.n);
  const tipos = {};
  meus.forEach(x=> tipos[x.t] = (tipos[x.t]||0)+1);
  pessoas[n] = {total: meus.length, tipos, negocios, tocados: negocios.length,
                dias: new Set(meus.map(x=>x.q)).size};
 });

 /* negócio: atividades, contatos, dias parado e temperatura na janela */
 const agg = {};
 A.forEach(x=>{ if(!x.i) return;
  const o = agg[x.i] = agg[x.i] || {n:0, r:0, ult:''};
  o.n++; if(REAL.includes(x.t)) o.r++;
  if(x.q > o.ult) o.ult = x.q;
 });
 const negocios = D.negocios.map(b=>{
  const o = agg[b.id] || {n:0, r:0, ult:''};
  /* referência = último toque conhecido ATÉ o fim da janela.
     Nada depois de PER.fim entra, senão o passado parece recente. */
  const cand = [o.ult, b.u <= PER.fim ? b.u : ''].filter(Boolean);
  const ref = cand.length ? cand.reduce((a,c)=> c>a?c:a) : '';
  const parado = ref ? dif(ref, PER.fim) : 999;
  const viva = !MORTAS.includes(b.e);
  /* quente exige CONTATO recente, não só a etapa ter sido mexida */
  const recente = o.ult && dif(o.ult, PER.fim) <= 7;
  const temp = (viva && b.av && recente) ? 'quente'
             : (viva && (b.av || o.n>=3)) ? 'morno' : 'frio';
  const nota = D.ativ.find(z => z.i===b.id && z.n && z.q>=PER.ini && z.q<=PER.fim);
  return {...b, n:o.n, r:o.r, r0:o.r, p:parado, temp, s: nota ? nota.n : ''};
 });

 const t = {quente:0, morno:0, frio:0};
 negocios.forEach(x=> t[x.temp]++);

 /* série diária dentro da janela */
 const datas = []; 
 for(let i=0, d=new Date(PER.ini+'T12:00:00'); i<400 && d.toISOString().slice(0,10)<=PER.fim; i++,
     d.setDate(d.getDate()+1)) datas.push(d.toISOString().slice(0,10));
 const fds = datas.map(q => [0,6].includes(new Date(q+'T12:00:00').getDay()) ? 1 : 0);
 const diario = {};
 NOMES.forEach(n=>{
  const real = datas.map(q => A.filter(x=>x.a===n && x.q===q && REAL.includes(x.t)).length);
  const nn   = datas.map(q => new Set(A.filter(x=>x.a===n && x.q===q && x.i).map(x=>x.i)).size);
  diario[n] = {real, neg: nn};
 });

 const et = {};
 negocios.filter(x=>x.f==='Painéis').forEach(x=> et[x.e]=(et[x.e]||0)+1);
 const ORD = {'Lead':1,'Em contato':2,'Qualificado':3,'Mídia Kit':4,'Visita':5,'Proposta':6,
              'Fechado':7,'Nutrição':8,'Sem interesse':9};
 const paineisEtapas = Object.entries(et).map(([e,n])=>({e,n}))
   .sort((a,b)=>(ORD[a.e]||9)-(ORD[b.e]||9));

 V = {A, pessoas, negocios, temperaturas:t, diario:{datas, fds, p:diario}, paineisEtapas};
}
/* Jonathas é a conta do dono; quem opera por ela é a Keth.
   Toda leitura de nome passa por aqui — se um dado novo trouxer Jonathas, ele
   já entra normalizado e não volta a aparecer na tela. */
const APELIDO = {Jonathas:'Keth'};
const quem = n => APELIDO[n] || n;
const EMPRESAS = {
 izi: {
  rot:'Izi Imóveis', curto:'IZI', subtitulo:'Clientes, imóveis, áreas e conversão',
  funis:['Vendas','SDR','Angariação'],
  abas:[['resumo','Resumo'],['quentes','Clientes quentes'],['leitura','Conversas'],
   ['resultado','Resultados'],['atividades','Atividades'],['pessoas','Equipe'],
   ['operacao','Imóveis e áreas'],['alertas','Alertas'],['matinal','Reunião']]
 },
 paineis: {
  rot:'BJ7 Painéis', curto:'Painéis', subtitulo:'Anunciantes, oportunidades e operação comercial',
  funis:['Painéis'],
  abas:[['resumo','Resumo'],['quentes','Oportunidades quentes'],['leitura','Conversas'],
   ['resultado','Resultados'],['atividades','Atividades'],['pessoas','Equipe'],
   ['operacao','Comercial e ocupação'],['alertas','Alertas'],['matinal','Reunião']]
 }
};
let empresaAtual = 'izi';
let FUNIS = [...EMPRESAS.izi.funis];
let NOMES = [];
/* Se alguém não teve atividade no período, ainda assim precisa aparecer com zero —
   senão some do painel e o zero, que é a informação, desaparece junto. */
let EQUIPE = [];
const FRENTES = {
 izi:{Nicolas:'mercado, captação e construtoras', Keth:'clientes e conversão',
  Rafael:'saiu em março de 2026'},
 paineis:{Gabriel:'comercial e operação de mídia'}
};
const frenteDe = n => (FRENTES[empresaAtual]||{})[n] || 'sem frente definida nesta empresa';
const QUENTES = ['Qualificado','Mídia Kit','Visita','Proposta'];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf  = n => n.toLocaleString('pt-BR');
const realDe = p => REAL.reduce((s,k)=> s + (p.tipos[k]||0), 0);
function cartoes(defs){
 const box = el('<div class="kpis"></div>');
 defs.forEach(d=>{
  const c = el('<'+(d.click?'button':'div')+' class="kpi'+(d.click?' kpib':'')+(d.on?' on':'')+'">'
   +'<b class="num">'+d.b+'</b><span>'+d.s+(d.dl?'<i class="dl">'+d.dl+'</i>':'')+'</span></'
   +(d.click?'button':'div')+'>');
  if(d.click) c.onclick = d.click;
  box.append(c);
 });
 return box;
}
let PRESET = null;
function irPara(aba, preset){ PRESET = preset; atual = aba; render(); window.scrollTo({top:0}); }

const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };

/* atualização — só funciona quando a página é servida pelo Worker,
   que tem a rota /atualizar e a chave do Pipedrive no servidor. */
(function(){
 const b = document.getElementById('btnAtualizar');
 const pill = document.getElementById('pill');
 let ocupado = false;
 b.onclick = async () => {
  if(ocupado) return;
  ocupado = true;
  const antes = b.textContent;
  b.textContent = 'Atualizando…'; b.disabled = true;
  const aviso = t => {
   b.textContent = antes; b.disabled = false; ocupado = false;
   const n = el('<div class="mask"><div class="modal" role="dialog" aria-modal="true">'
    +'<h3>Não consegui atualizar</h3><p class="lede">'+esc(t)+'</p>'
    +'<div class="actions"><button class="btn" data-x>Fechar</button></div></div></div>');
   n.querySelector('[data-x]').onclick = () => n.remove();
   n.onclick = e => { if(e.target===n) n.remove(); };
   document.body.append(n);
  };
  try {
   const r = await fetch('/atualizar', {method:'POST', headers:{'accept':'application/json'}});
   const ct = r.headers.get('content-type') || '';
   if(!ct.includes('json'))
    return aviso('Esta página está aberta como arquivo, não pelo endereço do Worker. '
     +'O botão só funciona no endereço publicado na Cloudflare, que é quem fala com o Pipedrive.');
   const j = await r.json();
   if(!j.ok) return aviso('O Worker respondeu com erro: '+(j.erro||'sem detalhe')
     +'. Confira se a chave do Pipedrive foi gravada com wrangler secret put PIPEDRIVE_TOKEN.');
   b.textContent = 'Pronto';
   setTimeout(()=>location.reload(), 600);
  } catch(e) {
   aviso('Não foi possível falar com o servidor: '+(e.message||e));
  }
 };
})();

/* idade do dado */
(function(){
 const [d,m,y] = D.extracao.split('/').map(Number);
 const dias = Math.round((Date.now() - new Date(y, m-1, d)) / 864e5);
 let txt = dias<=0 ? 'Dados de hoje' : dias===1 ? 'Dados de ontem' : 'Dados de '+dias+' dias atrás';
 if(D.sincronizadoEm){
  const s2 = new Date(D.sincronizadoEm);
  const min = Math.round((Date.now()-s2)/6e4);
  txt = min < 2 ? 'Atualizado agora'
      : min < 60 ? 'Atualizado há '+min+' min'
      : min < 1440 ? 'Atualizado às '+s2.toTimeString().slice(0,5)
      : txt;
 }
 document.getElementById('pilltxt').textContent = txt;
 if(dias>2) document.getElementById('dot').classList.add('old');
 document.getElementById('pill').title = 'Extraído do Pipedrive em '+D.extracao;
})();

/* ---------------- alertas ---------------- */

function tabela(host, rows, cols, vazio, rotulo){
 let ord = {k:cols[0].k, dir:1}, termo='', lim=150;
 const box = el('<div></div>');
 const tools = el('<div class="tools"><input class="search" type="search" placeholder="Buscar…" aria-label="Buscar">'
  +'<select class="selord so-mob" aria-label="Ordenar por">'
  + cols.map(c=>'<option value="'+c.k+'">'+c.h+'</option>').join('')
  +'</select><span class="mini" data-cnt></span></div>');
 const scroll = el('<div class="scroll"></div>');
 box.append(tools, scroll);
 host.append(box);
 const inp = tools.querySelector('input'), cnt = tools.querySelector('[data-cnt]');
 const so = tools.querySelector('select');
 inp.oninput = () => { termo = inp.value.toLowerCase(); lim=150; pinta(); };
 so.onchange = () => { const c = cols.find(z=>z.k===so.value);
  ord = {k: so.value, dir: typeof rows[0][so.value]==='number' ? -1 : 1}; pinta(); };

 function pinta(){
  let r = rows.filter(x => !termo || cols.some(c => String(x[c.k]).toLowerCase().includes(termo)));
  r = [...r].sort((a,b)=>{
   const A=a[ord.k], B=b[ord.k];
   return (typeof A==='number' ? A-B : String(A).localeCompare(String(B),'pt-BR')) * ord.dir;
  });
  const rot = rotulo || 'registros';
  cnt.textContent = r.length===rows.length ? nf(rows.length)+' '+rot : nf(r.length)+' de '+nf(rows.length);
  const total = r.length;
  const visiveis = r.slice(0, lim);
  if(!r.length){ scroll.innerHTML = '<div class="empty">'+esc(vazio||'Nada encontrado com esse termo.')+'</div>'; return; }
  scroll.innerHTML = '<table><thead><tr>' + cols.map(c =>
     '<th class="'+(c.r?'r ':'')+(ord.k===c.k?'sorted '+(ord.dir<0?'desc':''):'')+'" data-k="'+c.k+'">'+c.h+'</th>').join('')
   + '</tr></thead><tbody>' + visiveis.map(x => '<tr>' + cols.map((c,ci) =>
     '<td class="'+(c.r?'r':'')+(ci===0?' td1':'')+'" data-l="'+esc(c.h)+'">'
     +(c.f? c.f(x) : esc(x[c.k]))+'</td>').join('') + '</tr>').join('')
   + '</tbody></table>';
  if(total > lim){
   const mais = el('<button class="btn ghost maisbtn">Mostrar mais '
     + Math.min(150, total-lim) + ' de ' + nf(total-lim) + ' restantes</button>');
   mais.onclick = () => { lim += 150; pinta(); };
   scroll.append(mais);
  }
  scroll.querySelectorAll('button.lnk').forEach(b => b.onclick = () =>
   abrirHistorico(b.dataset.id, b.dataset.t));
  scroll.querySelectorAll('th').forEach(th => th.onclick = () => {
   const k = th.dataset.k;
   ord = { k, dir: ord.k===k ? -ord.dir : (typeof rows[0][k]==='number' ? -1 : 1) };
   so.value = k; pinta();
  });
 }
 pinta();
}

const PDI = [
 ['forte','O que está indo bem'],
 ['gap','O que precisa melhorar'],

function diagnostico(n){
 const p = V.pessoas[n], r = realDe(p);
 const negs = V.negocios.filter(x=>x.d===n);
 const semNota = p.negocios.filter(x=>!x.s).length;
 const C = cadenciaDe(V.A.filter(x=>x.a===n));
 const umToque = C.filter(x=>x.n===1).length;
 const out = [];
 if(!p.total) return [['Sem atividade registrada no período. Não há o que avaliar — o problema é registro, não desempenho.','ruim']];
 out.push([p.tocados+' negócios trabalhados em '+p.dias+' dias ativos, '
   +(p.tocados/Math.max(p.dias,1)).toFixed(1)+' por dia', 'neutro']);
 out.push([Math.round(r/p.total*100)+'% das atividades foram contato real', r/p.total>=.7?'bom':'ruim']);
 if(C.length) out.push([Math.round(umToque/C.length*100)+'% dos negócios receberam um único contato',
   umToque/C.length<=.2?'bom':'ruim']);
 if(p.negocios.length) out.push([semNota+' de '+p.negocios.length+' negócios sem uma linha escrita',
   semNota/p.negocios.length<=.2?'bom':'ruim']);
 if(negs.length) out.push([negs.filter(x=>x.temp==='quente').length+' negócios quentes na carteira de '
   +negs.length, negs.filter(x=>x.temp==='quente').length>0?'bom':'ruim']);
 const g = D.resultado.filter(x=>x.d===n && x.r==='ganho').length;
 out.push([g? g+' ganhos no histórico' : 'nenhum ganho registrado no histórico', g?'bom':'ruim']);
 return out;
}

const ORDEM_ETAPA = {'Lead':1,'Lead novo':1,'Em contato':2,'Realizando contato':2,'Prospecção':2,
 'Contato Realizado':3,'Respondeu':3,'Qualificado':4,'Qualificados':4,'Follow-up':2,
 'Mídia Kit':5,'Análise Documentação':5,'Apresentando oportunidades':5,'Visita':6,'Portfólio':6,
 'Proposta':7,'Fechamento':8,'Fechado':9,'Nutrição':10,'Longo prazo':10,'Longo Prazo':10,
 'Sem interesse':11,'Arquivado':11,'Não respondeu - IA':11,'Sem número':11};
const noPeriodo  = x => x.q  >= PER.ini && x.q  <= PER.fim;   /* fechado no período */
const criadoNoPer = x => x.cr >= PER.ini && x.cr <= PER.fim;   /* aberto no período */

function totais(){
 const g  = D.resultado.filter(x=>x.r==='ganho' && noPeriodo(x));
 const pc = D.resultado.filter(x=>x.r==='perdido' && !x.op && noPeriodo(x));
 const po = D.resultado.filter(x=>x.r==='perdido' && x.op && noPeriodo(x));
 const novos = D.negocios.filter(criadoNoPer).length
             + D.resultado.filter(criadoNoPer).length;
 return {novos, carteira: D.negocios.length, g:g.length, pc:pc.length, po:po.length,
   conv: (g.length+pc.length) ? g.length/(g.length+pc.length)*100 : null};
}
function porFunil(){
 return FUNIS.map(f=>{
  const noF = x => x.f===f;
  const g  = D.resultado.filter(x=>noF(x) && x.r==='ganho' && noPeriodo(x)).length;
  const pc = D.resultado.filter(x=>noF(x) && x.r==='perdido' && !x.op && noPeriodo(x)).length;
  const po = D.resultado.filter(x=>noF(x) && x.r==='perdido' && x.op && noPeriodo(x)).length;
  const novos = D.negocios.filter(x=>noF(x) && criadoNoPer(x)).length
              + D.resultado.filter(x=>noF(x) && criadoNoPer(x)).length;
  const cart = D.negocios.filter(noF).length;
  return {f, novos, cart, g, pc, po, conv:(g+pc)? g/(g+pc)*100 : null};
 }).sort((a,b)=>b.cart-a.cart);
}
const mediana = a => { if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y);
 return b[Math.floor(b.length/2)]; };

const ETAPA_ANG = ['Prospecção','Contato Realizado','Análise Documentação','Portfólio'];
function quadraDe(t){
 const m = t.match(/Q\s*(\d+)/i);
 return m ? 'Quadra '+m[1] : null;
}
function loteDe(t){
 const m = t.match(/^(.*?)\s*Q\s*\d+/i);
 return m && m[1].trim() ? m[1].trim() : t;
}

function blocoAreas(m, N){
 const ang = N.filter(x=>x.f==='Angariação');
 if(!ang.length) return;
 const areas = {};
 const soltos = [];
 ang.forEach(x=>{ const q = quadraDe(x.t); if(q) (areas[q] = areas[q]||[]).push(x); else soltos.push(x); });
 const lista = Object.entries(areas).sort((a,b)=>b[1].length-a[1].length);
 if(!lista.length) return;

 m.append(el('<h2>Áreas em formação</h2>'));
 m.append(el('<p class="lede">Cada área é um conjunto de lotes da mesma quadra. A área só é vendável para '
  +'incorporador quando <b>todos</b> os lotes avançam — então ela anda na velocidade do lote mais atrasado. '
  +'É esse lote que aparece destacado.</p>'));

 const bx = el('<div></div>');
 lista.forEach(([q, lotes])=>{
  const idx = lotes.map(x=> ETAPA_ANG.indexOf(x.e));
  const trava = lotes[idx.indexOf(Math.min(...idx.filter(i=>i>=0).concat(idx)))] || lotes[0];
  const parados = lotes.filter(x=>x.e==='Longo prazo').length;
  const avanco = Math.max(0, Math.min(...lotes.map(x=>{
    const i = ETAPA_ANG.indexOf(x.e); return i<0 ? 0 : i+1; })));
  const maisVelho = Math.max(...lotes.map(x=>x.p));
  linha(bx,
   '<div class="hd"><span class="nm">'+esc(q)+'</span>'
    +'<span class="stat num">'+lotes.length+' lotes</span></div>'
    +'<div class="sub">Trava em <b>'+esc(loteDe(trava.t))+'</b>, que está em '+esc(trava.e)
    +(parados? ' · '+parados+' lote'+(parados>1?'s':'')+' em longo prazo' : '')
    +' · mais parado há '+maisVelho+' dias</div>'
    +'<div class="etapas">'+ETAPA_ANG.map((e,i)=>'<span class="et'
      +(i < avanco ? ' feito':'')+'">'+e+'</span>').join('')+'</div>',
   host => {

       +esc(x.lote)+'</button>'},
     {k:'e', h:'Etapa', f:x=>'<span class="tag '+(x.e==='Longo prazo'?'t-gray':'t-teal')+'">'+esc(x.e)+'</span>'},
     {k:'cl', h:'Proprietário', f:x=> x.cl ? esc(x.cl) : '<span class="mini warn">não cadastrado</span>'},
     {k:'p', h:'Parado', r:1, f:x=> (x.p>30?'<span class="warn">':'<span>')+x.p+' d</span>'},
     {k:'s', h:'Situação', f:x=> x.s ? '<span class="sit">'+esc(x.s)+'</span>'

 });
 m.append(bx);

 const semDono = ang.filter(x=>!x.cl).length;

function grafico(host, metrica){
 const dts = V.diario.datas, fds = V.diario.fds;
 const max = Math.max(1, ...NOMES.flatMap(n => V.diario.p[n][metrica]));
 NOMES.forEach(n=>{
  const v = V.diario.p[n][metrica];
  const p = V.pessoas[n];
  const bloco = el('<div class="chart"><div class="lbl"><span class="nm">'+n+'</span>'
   +'<span class="stat num">'+p.tocados+' negócios · '+p.total+' atividades · '+p.dias+' dias com registro</span></div></div>');
  const barras = el('<div class="dias"></div>');
  const leitura = el('<div class="leitura"></div>');
  const detalhe = el('<div></div>');
  const uteis = v.filter((_,i)=>!fds[i]);
  const vazios = uteis.filter(x=>!x).length;
  const base = '<span class="lg"><i class="lg-u"></i>dia útil</span>'
   + '<span class="lg"><i class="lg-f"></i>fim de semana</span> — '
   + (vazios ? '<b>'+vazios+'</b> dia'+(vazios>1?'s':'')+' útil'+(vazios>1?'eis':'')
       +' sem registro. Toque numa barra para abrir o dia.'
     : 'nenhum dia útil em branco. Toque numa barra para abrir o dia.');
  leitura.innerHTML = base;

  v.forEach((y,i)=>{
   const h = y ? Math.max(y/max*100, 4) : 3;
   const b = el('<button class="dia'+(y?'':' zero')+(fds[i]?' fds':'')+'" '
     +'aria-label="'+dts[i].slice(8,10)+'/'+dts[i].slice(5,7)+': '+y+'">'
     +'<span class="b" style="height:'+h+'%"></span></button>');
   b.onclick = () => {
    const jaAberto = b.classList.contains('sel');
    barras.querySelectorAll('.dia').forEach(x=>x.classList.remove('sel'));
    detalhe.innerHTML='';
    if(jaAberto){ leitura.innerHTML = base; return; }
    b.classList.add('sel');

    const sem = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][dia.getDay()];
    const doDia = V.A.filter(x=>x.a===n && x.q===dts[i]);

    leitura.innerHTML = '<b>'+dts[i].slice(8,10)+'/'+dts[i].slice(5,7)+', '+sem+'</b> — '
      + (doDia.length ? negs+' negócios em '+doDia.length+' atividades'
         : (fds[i] ? 'fim de semana, sem registro' : 'nenhum registro neste dia útil'));
    if(doDia.length){
     tabela(detalhe, doDia.map(x=>({...x, cl:(fichaDe(x.i)||{}).cl||''})), [
      {k:'h', h:'Hora', f:x=> x.h || '—'},

      {k:'d', h:'Negócio', f:x=> x.i
        ? '<button type="button" class="lnk" data-id="'+x.i+'" data-t="'+esc(x.d)+'">'+esc(x.d)+'</button>'
        : '<span class="mini warn">solta</span>'},

      {k:'n', h:'O que foi conversado', f:x=> x.n ? '<span class="sit">'+esc(x.n)+'</span>'
        : '<span class="mini warn">nada escrito</span>'},
     ], '', 'atividades');
    }
   };
   barras.append(b);
  });

   + dts.map((q,i)=>'<span class="'+(fds[i]?'fds':'')+'">'
       +(+q.slice(8,10)%2 ? q.slice(8,10) : '')+'</span>').join('') + '</div>');

 });

function abrirHistorico(id, titulo){

 const itens = D.ativ.filter(x => String(x.i)===String(id));
 const cli = f && f.cl ? f.cl : '';
 const tel = f && f.tel ? f.tel : '';
 const telLimpo = tel.replace(/\D/g,'');

 let topo = '';
 if(f){
  const linhas = [];
  if(f.e) linhas.push(['Etapa', esc(f.e) + (f.f? ' · '+esc(f.f) : '')]);
  if(f.d) linhas.push(['Responsável', esc(f.d)]);
  if(f.temp) linhas.push(['Temperatura',
    '<span class="temp '+f.temp+'"></span>'+f.temp+(f.p!=null? ', parado há '+f.p+' dias':'')]);
  if(f.r) linhas.push(['Resultado', f.r==='ganho' ? 'ganho em '+f.q.slice(8,10)+'/'+f.q.slice(5,7)+'/'+f.q.slice(0,4)
    : 'perdido em '+f.q.slice(8,10)+'/'+f.q.slice(5,7)+'/'+f.q.slice(0,4)+(f.cat? ' — '+esc(f.cat):'')]);
  if(f.m) linhas.push(['Motivo', esc(f.m)]);

  if(f.n!=null && !f.r) linhas.push(['No período', f.n+' atividades, '+f.r0+' contatos']);
  topo = '<div class="ficha">' + linhas.map(([k,v])=>
    '<div class="fl"><span>'+k+'</span><div>'+v+'</div></div>').join('') + '</div>';
 }

 const cab = '<h3>'+esc(titulo)+'</h3>'
  + (cli ? '<p class="cliente">'+esc(cli)

     +(x.h? ' às '+x.h : '')+'</span><span>'+esc(x.a)+'</span></div><p>'
     +(x.n? esc(x.n) : '<span class="mini warn">sem anotação</span>')+'</p></div>').join('') + '</div>'
  : '<div class="empty">Nenhuma atividade registrada no período carregado.</div>';

 const mask = el('<div class="mask"><div class="modal" role="dialog" aria-modal="true">'
  + cab
  + '<h4 class="sec">Conversa'+(itens.length?' — '+itens.length+' registros':'')+'</h4>'
  + corpo
  + '<div class="actions"><button class="btn ghost" data-x>Fechar</button></div></div></div>');
 const fecha = () => { mask.remove(); document.removeEventListener('keydown', onEsc); };
 const onEsc = e => { if(e.key==='Escape') fecha(); };
 mask.onclick = e => { if(e.target===mask) fecha(); };
 mask.querySelector('[data-x]').onclick = fecha;
 document.addEventListener('keydown', onEsc);
 document.body.append(mask);
 mask.querySelector('[data-x]').focus();
}

/* ---------------- leitura das conversas ---------------- */
const SINAL_BOM = [
 [/(propost|or[çc]amento|m[íi]dia kit|contrato|minuta)/i, 3, 'proposta ou documento em jogo'],
 [/(reuni[ãa]o|visita|vamos marcar|agendad|marcar)/i, 3, 'reunião ou visita combinada'],
 [/(interessad|tem interesse|gostou|quer (comprar|alugar|investir|fechar))/i, 3, 'interesse declarado'],
 [/(aguardando|vai (retornar|responder|analisar)|ficou de)/i, 2, 'ficou de retornar'],
 [/(negociar|desconto|condi[çc][ãa]o|valor|pre[çc]o)/i, 2, 'conversa chegou no preço'],
 [/(document|matr[íi]cula|cpf|certid[ãa]o|escritura)/i, 2, 'documentação em andamento'],
];
const SINAL_RUIM = [
 [/(sem interesse|n[ãa]o tem interesse|n[ãa]o quer|desist|j[áa] comprou|j[áa] resolvi)/i, -6, 'disse não'],
 [/(n[ãa]o respond|sem retorno|n[ãa]o atende|sumiu)/i, -3, 'parou de responder'],
 [/(depois|mais para frente|ano que vem|sem pressa|longo prazo)/i, -2, 'empurrou para frente'],
];

function lerNegocio(x, ativs) {
 const notas = ativs.filter(a => a.i === x.id && a.n)
   .sort((a,b)=> a.q+a.h < b.q+b.h ? 1 : -1);
 const texto = notas.map(a=>a.n).join(' — ');
 const motivos = [];
 let p = 0;
 SINAL_BOM.forEach(([re,peso,rot])=>{ if(re.test(texto)){ p += peso; motivos.push(['+',rot]); } });
 SINAL_RUIM.forEach(([re,peso,rot])=>{ if(re.test(texto)){ p += peso; motivos.push(['-',rot]); } });
 if(x.av){ p += 4; motivos.push(['+','está em etapa avançada: '+x.e]); }
 if(x.r0 >= 3){ p += 2; motivos.push(['+', x.r0+' contatos reais no período']); }
 else if(x.r0 === 0){ p -= 3; motivos.push(['-','nenhum contato real no período']); }
 if(x.p <= 7){ p += 3; motivos.push(['+','falado há '+x.p+' dias']); }
 else if(x.p > 30){ p -= 4; motivos.push(['-','parado há '+x.p+' dias']); }
 if(!notas.length){ p -= 3; motivos.push(['-','ninguém escreveu nada']); }
 if(MORTAS.includes(x.e)){ p -= 6; motivos.push(['-','etapa de descarte: '+x.e]); }
 return { ...x, nota: Math.max(0, Math.min(20, p + 6)),
   resumo: notas.length ? notas[0].n : '', historico: notas, motivos };
}

function cadenciaDe(A){
 const g = {};
 A.forEach(x=>{
  if(!x.i) return;
  const o = g[x.i] = g[x.i] || {id:x.i, t:x.d, datas:[], canais:{}, notas:0, r:0};
  o.datas.push(x.q);
  if(REAL.includes(x.t)) o.r++;
  o.canais[x.t] = (o.canais[x.t]||0)+1;
  if(x.n) o.notas++;
 });
 return Object.values(g).map(o=>{
  o.datas.sort();
  const pri = o.datas[0], ult = o.datas[o.datas.length-1];
  const vao = dif(pri, ult);
  const f = fichaDe(o.id) || {};
  return {...o, n:o.datas.length, pri, ult,
   int: o.datas.length>1 ? Math.round(vao/(o.datas.length-1)) : null,
   desde: dif(ult, PER.fim),
   cl: f.cl||'', tel:f.tel||'', e:f.e||'', fu:f.f||'', d:f.d||'',
   ch: Object.entries(o.canais).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(', ')};
 }).sort((a,b)=>b.n-a.n);
}

function fechamentoDia(dia){
 const A = D.ativ.filter(x=>x.q===dia);
 return NOMES.map(n=>{
  const meus = A.filter(x=>x.a===n);
  return {n,
   trab: new Set(meus.filter(x=>x.i).map(x=>x.i)).size,
   cont: meus.filter(x=>REAL.includes(x.t)).length,
   ganhos: D.resultado.filter(x=>x.d===n && x.r==='ganho' && x.q===dia).length,
   perdidos: D.resultado.filter(x=>x.d===n && x.r==='perdido' && !x.op && x.q===dia).length};
 });
}

function apresentacaoTexto(){

  const c = [...tr.children].map(td=>td.textContent.trim()).filter(Boolean);

 });
 div.querySelectorAll('h2').forEach(h=> h.replaceWith(document.createTextNode('\n*'+h.textContent+'*\n')));

const MES_NOME = {'01':'jan','02':'fev','03':'mar','04':'abr','05':'mai','06':'jun',
 '07':'jul','08':'ago','09':'set','10':'out','11':'nov','12':'dez'};
const ATALHOS = [['hoje','Hoje'],['ontem','Ontem'],['7','7 dias'],['30','30 dias'],['tudo','Tudo']];
function montarPeriodo(){
 const box = document.getElementById('periodo');
 const seg = el('<div class="seg">' + ATALHOS.map(([k,r])=>'<button data-k="'+k+'">'+r+'</button>').join('') + '</div>');
 const mes = el('<select class="selmes" aria-label="Mês"><option value="">Mês…</option>'
   + D.meses.slice().reverse().map(m=>'<option value="'+m+'">'+MES_NOME[m.slice(5)]+'/'+m.slice(0,4)+'</option>').join('')
   + '</select>');
 const dts = el('<div class="datas"><input type="date" id="pi" aria-label="Início"> até '
   +'<input type="date" id="pf" aria-label="Fim"></div>');
 const res = el('<span class="res" id="pres"></span>');
 box.append(seg, mes, dts, res);
 const pi = dts.querySelector('#pi'), pf = dts.querySelector('#pf');
 pi.min = pf.min = D.janela.ini; pi.max = pf.max = D.janela.fim;

 const aplicar = (ini, fim, rot, atalho, selMes) => {
  PER = {ini, fim, rot};
  pi.value = ini; pf.value = fim; mes.value = selMes || '';
  seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===atalho));
  calcular();
  const n = dif(ini,fim)+1;
  res.textContent = n + (n>1?' dias, ':' dia, ') + V.A.length + ' atividades';
  render();
 };
 const doMes = m => {
  const fimM = new Date(+m.slice(0,4), +m.slice(5), 0).toISOString().slice(0,10);
  aplicar(m+'-01', fimM > D.janela.fim ? D.janela.fim : fimM,
    MES_NOME[m.slice(5)]+' de '+m.slice(0,4), '', m);
 };
 seg.querySelectorAll('button').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if(k==='tudo') aplicar(D.janela.ini, D.janela.fim,
    'de '+dbr(D.janela.ini)+' a '+dbr(D.janela.fim), 'tudo');
  else if(k==='hoje') aplicar(HOJE, HOJE, 'hoje, '+dbr(HOJE), 'hoje');
  else if(k==='ontem'){ const o = recua(2); aplicar(o, o, 'ontem, '+dbr(o), 'ontem'); }
  else { const i = recua(+k); aplicar(i < D.janela.ini ? D.janela.ini : i, D.janela.fim, 'últimos '+k+' dias', k); }
 });
 mes.onchange = () => { if(mes.value) doMes(mes.value); };
 [pi,pf].forEach(x => x.onchange = () => {
  if(!pi.value || !pf.value || pi.value > pf.value) return;
  aplicar(pi.value, pf.value,
    pi.value.slice(8,10)+'/'+pi.value.slice(5,7)+' a '+pf.value.slice(8,10)+'/'+pf.value.slice(5,7), '');
 });
 doMes(D.meses[D.meses.length-1]);
}

function linha(host, html, preencher){
 const b = el('<button class="row" aria-expanded="false">'+html+'</button>');
 host.append(b);
 b.onclick = () => {
  const aberto = b.getAttribute('aria-expanded')==='true';
  host.querySelectorAll('.panel').forEach(p=>p.remove());
  host.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-expanded','false'));
  if(aberto) return;
  b.setAttribute('aria-expanded','true');
  const p = el('<div class="panel"></div>');
  b.after(p); preencher(p);
 };
}
