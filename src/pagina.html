<style>
:root{
 --paper:#F4F5F2; --card:#FFFFFF; --ink:#15181A; --soft:#666E74; --faint:#98A0A6;
 --rule:#E3E5E1; --rule2:#CBCFCA;
 --teal:#0B5F52; --teal-bg:#EAF3F1;
 --clay:#9E2B3C; --clay-bg:#FAEFF1;
 --ochre:#84590B; --ochre-bg:#FAF4E7;
 --tap:44px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.wrap{max-width:900px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);
 border-bottom:1px solid var(--rule);padding:env(safe-area-inset-top) 16px 0}
@media(min-width:1000px){
 body{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
 .lateral{display:flex;flex-direction:column;background:#0E2233;color:#C8D6E0;padding:22px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
 .lateral .marca{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.02em;
  padding:0 10px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
 .lateral .marca span{color:var(--ochre)}
 .lateral button{display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;background:none;border:0;color:#9FB3C4;font:inherit;font-size:14px;text-align:left;
  padding:11px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
 .lateral button:hover{background:rgba(255,255,255,.06);color:#fff}
 .lateral button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
 .lateral .bdg{background:var(--clay);color:#fff;border-radius:9px;padding:0 6px;
  font-size:10.5px;line-height:17px;font-weight:600}
 .lateral .rodape{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.1);
  font-size:11.5px;color:#6D8296;line-height:1.5}
 .conteudo{min-width:0}
 .top nav{display:none}
 .top{padding-top:16px}
 .wrap{padding-left:26px;padding-right:26px}
}
.lateral{display:none}
.top-in{max-width:900px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:14px 0 10px;max-height:70px;overflow:hidden;
 transition:max-height .18s ease,padding .18s ease,opacity .18s ease}
.top.compacto .brand{max-height:0;padding:0;opacity:0}
h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:650}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
.fresh{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);
 border:1px solid var(--rule2);border-radius:999px;padding:4px 10px;background:var(--card);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.dot.old{background:var(--ochre)}

/* faixas roláveis */
.hero{margin:6px 0 20px}
.hero h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.hero .lede{margin:0}

.kpis4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:26px}
.kpi4{display:flex;gap:13px;align-items:flex-start;background:var(--card);
 border:1px solid var(--rule);border-radius:12px;padding:16px}
.kpi4.alerta{border-color:#E8C9CE;background:#FDF7F8}
.kpi4 .ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--teal-bg);
 color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.kpi4.alerta .ic{background:#F6E3E6;color:var(--clay)}
.kpi4 .tt{font-size:12.5px;color:var(--soft)}
.kpi4 .vl{font-size:24px;letter-spacing:-.02em;margin:2px 0 3px;font-variant-numeric:tabular-nums}
.kpi4 .sb{font-size:12px;color:var(--faint);line-height:1.4}

.empresas-lista{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card)}
.emp-linha{display:grid;grid-template-columns:1.6fr 1fr 1fr .9fr;gap:12px;align-items:center;
 padding:15px 16px;border-bottom:1px solid var(--rule)}
.emp-linha:last-child{border-bottom:0}
.emp-linha:hover{background:#FAFBF9}
.emp-linha.off{opacity:.62}
.emp-nome b{display:block;font-size:15px}
.emp-nome .fonte{font-size:11.5px;color:var(--faint)}
.emp-num{font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.emp-num span{display:block;font-size:11.5px;color:var(--faint);font-variant-numeric:normal}
.emp-st{font-size:12.5px;color:var(--soft);display:flex;align-items:center;gap:6px;justify-content:flex-end}
.bola{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bola.ok{background:var(--teal)} .bola.at{background:var(--ochre)} .bola.off{background:var(--rule2)}
@media(max-width:700px){
 .emp-linha{grid-template-columns:1fr auto;gap:6px 10px}
 .emp-nome{grid-column:1/3}
 .emp-num{text-align:left}
 .emp-st{justify-content:flex-start}
}

.decisao{display:flex;gap:12px;align-items:center;justify-content:space-between;
 background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:13px 15px;margin-bottom:8px}
.alertas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.alerta-c{display:flex;gap:11px;background:var(--card);border:1px solid var(--rule);
 border-radius:10px;padding:14px;cursor:pointer;align-items:flex-start}
.alerta-c.crit{border-left:3px solid var(--clay)}
.alerta-c.alto{border-left:3px solid var(--ochre)}
.alerta-c .ico{width:24px;height:24px;flex:none;border-radius:6px;display:flex;align-items:center;
 justify-content:center;font-size:13px;font-weight:700}
.alerta-c.crit .ico{background:#F6E3E6;color:var(--clay)}
.alerta-c.alto .ico{background:var(--ochre-bg);color:var(--ochre)}
.alerta-c .tt{font-size:14px;color:var(--ink);line-height:1.3}
.alerta-c .sb{font-size:12px;color:var(--faint);margin-top:3px;line-height:1.4}

.integr{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:26px;padding-top:14px;
 border-top:1px solid var(--rule);font-size:12.5px;color:var(--soft)}
.integr span{display:flex;align-items:center;gap:6px}
.integr .dir{margin-left:auto;color:var(--faint)}

.empresas{display:flex;gap:10px;align-items:center;padding:2px 0 12px;overflow-x:auto;
 scrollbar-width:none}
.empresas::-webkit-scrollbar{display:none}
.empresas .seg{border:0;background:none;gap:8px;padding:0}
.empresas .seg button{height:44px;font-size:16px;font-weight:600;padding:0 18px;border-radius:10px;
 border:1px solid var(--rule2);background:var(--card);color:var(--soft);letter-spacing:-.01em}
.empresas .seg button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.empresas .res{font-size:12.5px;color:var(--faint);white-space:nowrap}
@media(max-width:520px){ .empresas .res{display:none} }
.periodo,nav{display:flex;gap:6px;align-items:center;overflow-x:auto;
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.periodo::-webkit-scrollbar,nav::-webkit-scrollbar{display:none}
.periodo{padding:0 0 10px}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;
 background:var(--card);flex:none}
.seg button{background:none;border:0;padding:0 14px;height:36px;font-size:13.5px;
 color:var(--soft);cursor:pointer;border-right:1px solid var(--rule2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.selmes,.selord{font:inherit;font-size:13.5px;height:36px;padding:0 30px 0 10px;flex:none;
 border:1px solid var(--rule2);border-radius:6px;background:var(--card);color:inherit;
 -webkit-appearance:none;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
   linear-gradient(135deg,var(--soft) 50%,transparent 50%);
 background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.datas{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--soft);flex:none}
.datas input{font:inherit;font-size:12.5px;height:36px;padding:0 8px;border:1px solid var(--rule2);
 border-radius:6px;background:var(--card);color:inherit}
.res{font-size:12px;color:var(--soft);white-space:nowrap;flex:none;padding-left:2px}

nav{border-top:1px solid var(--rule);margin-top:-1px}
nav button{background:none;border:0;padding:0 2px;height:var(--tap);font-size:15px;
 color:var(--soft);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
 margin-right:16px;flex:none}
nav button:last-child{margin-right:0}
nav button.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 0;
 border-top:1px solid var(--rule)}
.subnav::-webkit-scrollbar{display:none}

<script>
const D = __DADOS__;
/* Pontos por esforço. Ligação vale mais que WhatsApp, visita vale mais que as
   duas, e venda vale mais que tudo — é o que faz a soma virar prioridade. */
const PONTOS_PADRAO = {'Ligação':2, 'WhatsApp':1, 'Visita':5, 'Reunião':5, 'Proposta':3,
  'E-mail':1, 'Follow-up':1, 'Sem tipo':0};
const PONTOS_EXTRA = {venda:125, tarefaNoPrazo:5};
const pontosCfg = () => ({...PONTOS_PADRAO, ...((dados.pontos||{}).canais||{})});
const extraCfg  = () => ({...PONTOS_EXTRA, ...((dados.pontos||{}).extra||{})});
const metaPontos = n => ((dados.metasPontos||{})[n] || {semana:0, mes:0});

function pontosDe(n, ini, fim){
 const pc = pontosCfg(), ex = extraCfg();
 const ativ = D.ativ.filter(x=>x.a===n && x.q>=ini && x.q<=fim && ativNoEscopo(x));
 const porCanal = {};
 let total = 0;
 ativ.forEach(x=>{ const v = pc[x.t] ?? 0;
  porCanal[x.t] = porCanal[x.t] || {n:0, p:0};
  porCanal[x.t].n++; porCanal[x.t].p += v; total += v; });
 const vendas = D.resultado.filter(x=>noEscopo(x) && x.d===n && x.r==='ganho'
   && x.q>=ini && x.q<=fim).length;
 if(vendas){ porCanal['Venda'] = {n:vendas, p:vendas*ex.venda}; total += vendas*ex.venda; }
 const tarefas = (dados.registros && dados.registros.tarefas || [])
   .filter(r => (EMP.id==='grupo'||r.emp===EMP.id) && r.responsavel===n
     && r.status==='concluida' && r.prazo && r.prazo>=ini && r.prazo<=fim).length;
 if(tarefas){ porCanal['Tarefa no prazo'] = {n:tarefas, p:tarefas*ex.tarefaNoPrazo};
   total += tarefas*ex.tarefaNoPrazo; }
 return {total, porCanal, vendas, ativ:ativ.length};
}
const semanaAtual = () => {
 const d = new Date(HOJE+'T12:00:00');
 const seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay()+6)%7));
 const dom = new Date(seg); dom.setDate(seg.getDate()+6);
 return [seg.toISOString().slice(0,10), dom.toISOString().slice(0,10)];
};
const mesAtual = () => [HOJE.slice(0,8)+'01',
  new Date(+HOJE.slice(0,4), +HOJE.slice(5,7), 0).toISOString().slice(0,10)];

const REAL = ['Ligação','Visita','Reunião','WhatsApp'];
const MORTAS = D.mortas;
/* Se o conjunto de dados vier de uma versão anterior do Worker, campos podem
   faltar. Sem isto a página quebra inteira e não mostra nem o motivo. */
(function completar(){
 const hoje = D.hoje || new Date().toISOString().slice(0,10);
 D.hoje = hoje;
 D.negocios = D.negocios || []; D.resultado = D.resultado || []; D.ativ = D.ativ || [];
 D.mortas = D.mortas || [];
 D.negocios.forEach(x=>{ if(!x.cr) x.cr = x.u || hoje; });
 D.resultado.forEach(x=>{ if(!x.cr) x.cr = x.a || x.q || hoje; });
 const crs = [...D.negocios, ...D.resultado].map(x=>x.cr).filter(Boolean).sort();
 const qs  = D.ativ.map(x=>x.q).filter(Boolean).sort();
 D.janela = D.janela || {ini: crs[0] || hoje, fim: hoje};
 D.cobertura = Object.assign({ativDe: qs[0] || hoje, ativAte: qs[qs.length-1] || hoje,
   negDe: crs[0] || hoje, orfas: 0, orfasIds: []}, D.cobertura || {});
 D.extracao = D.extracao || (hoje.slice(8,10)+'/'+hoje.slice(5,7)+'/'+hoje.slice(0,4));
 if(!D.meses || !D.meses.length){
  D.meses = [];
  let [y,mm] = [+(D.janela.ini||hoje).slice(0,4), +(D.janela.ini||hoje).slice(5,7)];
  const fy = +hoje.slice(0,4), fm = +hoje.slice(5,7);
  while(y < fy || (y===fy && mm <= fm)){
   D.meses.push(y+'-'+String(mm).padStart(2,'0'));
   mm++; if(mm>12){ mm=1; y++; }
  }
 }
})();

const HOJE = D.hoje;
const COB = D.cobertura;
/* A janela em que existe registro de atividade. Fora dela, qualquer número de
   esforço é ausência de dado, não ausência de trabalho. */
const cobreAtiv = () => PER.ini >= COB.ativDe;
const dbr = d => d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const dif = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5);
const recua = (n) => { const x = new Date(HOJE+'T12:00:00'); x.setDate(x.getDate()-n+1);
                       return x.toISOString().slice(0,10); };

/* janela ativa — recalculada em toda a tela */
let PER = {ini: D.janela.ini, fim: D.janela.fim, rot: 'agosto de 2026'};
let V = null;                       /* visão calculada */

function calcular(){
 const A = D.ativ.filter(x => x.q >= PER.ini && x.q <= PER.fim && ativNoEscopo(x));

 NOMES = [...new Set([...EQUIPE(),
   ...A.map(x=>x.a),
   ...D.negocios.filter(x=>noEscopo(x)&&criadoNoPer(x)).map(x=>x.d),
   ...D.resultado.filter(x=>noEscopo(x)&&(noPeriodo(x)||criadoNoPer(x))).map(x=>x.d)])]
  .filter(Boolean).filter(n=>n!=='—');
 const pessoas = {};
 NOMES.forEach(n=>{
  const meus = A.filter(x=>x.a===n);
  const porDeal = {};
  meus.forEach(x=>{ if(!x.i) return;
   const o = porDeal[x.i] = porDeal[x.i] || {id:x.i, t:x.d, n:0, r:0, ult:'', tipos:{}};
   o.n++; if(REAL.includes(x.t)) o.r++;
   o.tipos[x.t] = (o.tipos[x.t]||0)+1;
   if(x.q > o.ult) o.ult = x.q;
  });
  const negocios = Object.values(porDeal).map(o=>({...o,
    tipos: Object.entries(o.tipos).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(', '),
    s: (D.ativ.find(z=>z.i===o.id && z.n) || {}).n || ''
  })).sort((a,b)=>b.n-a.n);
  const tipos = {};
  meus.forEach(x=> tipos[x.t] = (tipos[x.t]||0)+1);
  pessoas[n] = {total: meus.length, tipos, negocios, tocados: negocios.length,
                dias: new Set(meus.map(x=>x.q)).size};
 });

 /* negócio: atividades, contatos, dias parado e temperatura na janela */
 const agg = {};
 A.forEach(x=>{ if(!x.i) return;
  const o = agg[x.i] = agg[x.i] || {n:0, r:0, ult:''};
  o.n++; if(REAL.includes(x.t)) o.r++;
  if(x.q > o.ult) o.ult = x.q;
 });
 const negocios = D.negocios.filter(noEscopo).map(b=>{
  const o = agg[b.id] || {n:0, r:0, ult:''};
  /* referência = último toque conhecido ATÉ o fim da janela.
     Nada depois de PER.fim entra, senão o passado parece recente. */
  const cand = [o.ult, b.u <= PER.fim ? b.u : ''].filter(Boolean);
  const ref = cand.length ? cand.reduce((a,c)=> c>a?c:a) : '';
  const parado = ref ? dif(ref, PER.fim) : 999;
  const viva = !MORTAS.includes(b.e);
  /* quente exige CONTATO recente, não só a etapa ter sido mexida */
  const recente = o.ult && dif(o.ult, PER.fim) <= 7;
  const temp = (viva && b.av && recente) ? 'quente'
             : (viva && (b.av || o.n>=3)) ? 'morno' : 'frio';
  const nota = D.ativ.find(z => z.i===b.id && z.n && z.q>=PER.ini && z.q<=PER.fim);
  return {...b, n:o.n, r:o.r, r0:o.r, p:parado, temp, s: nota ? nota.n : ''};
 });

 const t = {quente:0, morno:0, frio:0};
 negocios.forEach(x=> t[x.temp]++);

 /* série diária dentro da janela */
 /* A série começa onde existe registro de atividade: antes disso seriam centenas
    de barras vazias, que não são ausência de trabalho e sim ausência de dado. */
 const serieIni = PER.ini > COB.ativDe ? PER.ini : COB.ativDe;
 const datas = [];
 for(let i=0, d=new Date(serieIni+'T12:00:00'); i<1200 && d.toISOString().slice(0,10)<=PER.fim; i++,
     d.setDate(d.getDate()+1)) datas.push(d.toISOString().slice(0,10));
 const fds = datas.map(q => [0,6].includes(new Date(q+'T12:00:00').getDay()) ? 1 : 0);
 const diario = {};
 NOMES.forEach(n=>{
  const real = datas.map(q => A.filter(x=>x.a===n && x.q===q && REAL.includes(x.t)).length);
  const nn   = datas.map(q => new Set(A.filter(x=>x.a===n && x.q===q && x.i).map(x=>x.i)).size);
  diario[n] = {real, neg: nn};
 });

 const et = {};
 negocios.filter(x=>x.f==='Painéis').forEach(x=> et[x.e]=(et[x.e]||0)+1);
 const ORD = {'Lead':1,'Em contato':2,'Qualificado':3,'Mídia Kit':4,'Visita':5,'Proposta':6,
              'Fechado':7,'Nutrição':8,'Sem interesse':9};
 const paineisEtapas = Object.entries(et).map(([e,n])=>({e,n}))
   .sort((a,b)=>(ORD[a.e]||9)-(ORD[b.e]||9));

 V = {A, pessoas, negocios, temperaturas:t, diario:{datas, fds, p:diario}, paineisEtapas};
}
/* Jonathas é a conta do dono; quem opera por ela é a Keth.
   Toda leitura de nome passa por aqui — se um dado novo trouxer Jonathas, ele
   já entra normalizado e não volta a aparecer na tela. */
const APELIDO = {Jonathas:'Keth'};
const quem = n => APELIDO[n] || n;
let NOMES = [];
/* Se alguém não teve atividade no período, ainda assim precisa aparecer com zero —
   senão some do painel e o zero, que é a informação, desaparece junto. */
const EQUIPE = () => [...new Set([
  ...D.ativ.filter(ativNoEscopo).map(x=>x.a),
  ...D.negocios.filter(noEscopo).map(x=>x.d)])].filter(n=>n && n!=='—');
const FRENTE = {Nicolas:'Izi — mercado e captação', Keth:'Izi — clientes e conversão',
 Gabriel:'BJ7 Painéis', Rafael:'saiu em março de 2026'};
const frenteDe = n => FRENTE[n] || 'sem frente definida';

/* Quem ainda está no time. Sai dos dados, não de uma lista fixa: sem atividade
   há mais de 60 dias e sem nenhum negócio aberto na mão. Quem saiu continua
   existindo no histórico — apagar a pessoa apagaria o trabalho dela. */
const DIAS_INATIVO = 60;
function ultimaAtividade(n){
 return D.ativ.filter(x=>x.a===n).map(x=>x.q).sort().pop() || null;
}
function ativo(n){
 if(D.negocios.some(x=>x.d===n)) return true;
 const u = ultimaAtividade(n);
 return u ? dif(u, D.hoje) <= DIAS_INATIVO : false;
}
const QUENTES = ['Qualificado','Mídia Kit','Visita','Proposta'];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf  = n => n.toLocaleString('pt-BR');
const realDe = p => REAL.reduce((s,k)=> s + (p.tipos[k]||0), 0);
function cartoes(defs){
 const box = el('<div class="kpis"></div>');
 defs.forEach(d=>{

   +'<b class="num">'+d.b+'</b><span>'+d.s+(d.dl?'<i class="dl">'+d.dl+'</i>':'')+'</span></'
   +(d.click?'button':'div')+'>');
  if(d.click) c.onclick = d.click;
  box.append(c);
 });
 return box;
}
let PRESET = null;

const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };

/* atualização — só funciona quando a página é servida pelo Worker,
   que tem a rota /atualizar e a chave do Pipedrive no servidor. */
(function(){
 const b = document.getElementById('btnAtualizar');
 const pill = document.getElementById('pill');
 let ocupado = false;
 b.onclick = async () => {
  if(ocupado) return;
  ocupado = true;
  const antes = b.textContent;
  b.textContent = 'Atualizando…'; b.disabled = true;
  const aviso = t => {
   b.textContent = antes; b.disabled = false; ocupado = false;
   const n = el('<div class="mask"><div class="modal" role="dialog" aria-modal="true">'
    +'<h3>Não consegui atualizar</h3><p class="lede">'+esc(t)+'</p>'
    +'<div class="actions"><button class="btn" data-x>Fechar</button></div></div></div>');
   n.querySelector('[data-x]').onclick = () => n.remove();
   n.onclick = e => { if(e.target===n) n.remove(); };
   document.body.append(n);
  };
  try {
   const r = await fetch('/atualizar', {method:'POST', headers:{'accept':'application/json'}});
   const ct = r.headers.get('content-type') || '';
   if(!ct.includes('json'))
    return aviso('Esta página está aberta como arquivo, não pelo endereço do Worker. '
     +'O botão só funciona no endereço publicado na Cloudflare, que é quem fala com o Pipedrive.');
   const j = await r.json();
   if(!j.ok) return aviso('O Worker respondeu com erro: '+(j.erro||'sem detalhe')
     +'. Confira se a chave do Pipedrive foi gravada com wrangler secret put PIPEDRIVE_TOKEN.');
   b.textContent = 'Pronto';
   setTimeout(()=>location.reload(), 600);
  } catch(e) {
   aviso('Não foi possível falar com o servidor: '+(e.message||e));
  }
 };
})();

/* idade do dado */

 if(D.sincronizadoEm){

/* ---------------- alertas ----------------
   Deixaram de ser texto fixo: cada um é uma regra que roda sobre os dados do
   período e da empresa. Some sozinho quando o problema acaba, e o limite de
   cada regra é ajustável em Configurar.                                      */

const CFG_PADRAO = {jornadaIni:'08:00', jornadaFim:'18:00', almocoMin:60,
  paradoDias:30, semContatoDias:14, cadenciaMax:1};
const cfg = () => ({...CFG_PADRAO, ...(dados.cfgAlertas||{})});

/* Cada alerta tem o próprio ajuste, no próprio cartão: liga e desliga, muda a
   gravidade, adia por uns dias e ignora pessoas específicas. */
const NIVEIS = [['critico','Crítico'],['alto','Alto'],['medio','Médio'],['off','Desligado']];
const PARAMS = {
 jornada_fora:   [['jornadaIni','Começo da jornada','time'],['jornadaFim','Fim da jornada','time']],
 jornada_almoco: [['almocoMin','Intervalo mínimo, em minutos','number']],
 parados:        [['paradoDias','Dias parado até avisar','number']],
 um_toque:       [['cadenciaMax','Até quantos contatos conta como abandonado','number']],
};
const COM_PESSOA = ['jornada_fora','jornada_almoco'];
const cfgA = id => (dados.cfgPorAlerta||{})[id] || {};
const gravaA = (id, mudanca) => {
 dados.cfgPorAlerta = dados.cfgPorAlerta || {};
 dados.cfgPorAlerta[id] = {...cfgA(id), ...mudanca};
 salvar(); render();
};
const nivelDe = (a) => cfgA(a.id).nivel || a.n;
const ignorados = id => cfgA(id).ignorar || [];
const adiadoAte = id => cfgA(id).ate || null;
const oculto = a => {
 const c = cfgA(a.id);
 if(c.nivel === 'off') return true;
 if(c.ate && c.ate > HOJE) return true;
 return !!(dados.ocultos||{})[a.id];   /* formato antigo, ainda respeitado */
};
const hhmm = h => { const [a,b]=(h||'').split(':').map(Number);
  return (a||a===0) ? a*60+(b||0) : null; };
const relogio = min => String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');

/* jornada: uma linha por pessoa e dia, com primeira e última atividade e o
   maior intervalo entre uma atividade e a seguinte */
function jornada(){
 const c = cfg(), ini = hhmm(c.jornadaIni), fim = hhmm(c.jornadaFim);
 const porDia = {};
 V.A.filter(x=>x.h).forEach(x=>{
  const k = x.a+'|'+x.q;
  (porDia[k] = porDia[k] || {quem:x.a, dia:x.q, min:[], itens:[]});
  porDia[k].min.push(hhmm(x.h)); porDia[k].itens.push(x);
 });
 return Object.values(porDia).map(d=>{
  d.min.sort((a,b)=>a-b);
  d.primeira = d.min[0]; d.ultima = d.min[d.min.length-1];
  let maior = 0, onde = null;
  for(let i=1;i<d.min.length;i++){ const g = d.min[i]-d.min[i-1];
    if(g>maior){ maior=g; onde=[d.min[i-1], d.min[i]]; } }
  d.maiorPausa = d.min.length>1 ? maior : null;
  d.janelaPausa = onde;
  d.cedo = d.primeira < ini ? d.itens.filter(x=>hhmm(x.h) < ini) : [];
  d.tarde = d.ultima > fim ? d.itens.filter(x=>hhmm(x.h) > fim) : [];
  d.semAlmoco = d.min.length>=4 && d.primeira <= 12*60 && d.ultima >= 14*60
    && (d.maiorPausa||0) < c.almocoMin;
  return d;
 }).sort((a,b)=> a.dia < b.dia ? 1 : -1);
}

function regrasAlerta(){
 const c = cfg(), J = jornada(), N = V.negocios;
 const fora = J.filter(d=>(d.cedo.length || d.tarde.length)
   && !ignorados('jornada_fora').includes(d.quem));
 const semInt = J.filter(d=>d.semAlmoco && !ignorados('jornada_almoco').includes(d.quem));
 const semDono = N.filter(x=>!x.cl);
 const paradosMuito = N.filter(x=>x.p > c.paradoDias && !MORTAS.includes(x.e));
 const descartadosAbertos = N.filter(x=>['Sem interesse','Arquivado'].includes(x.e));
 const soltas = V.A.filter(x=>!x.i);
 const semNota = N.filter(x=>!x.s && x.r0>0);
 const C = cadenciaDe(V.A);
 const umToque = C.filter(x=>x.n<=c.cadenciaMax);

 return [
  {id:'jornada_fora', n:'medio',
   t: (()=>{ const q = new Set(fora.map(d=>d.quem)).size;
      return q+(q===1?' pessoa':' pessoas')+' registrando fora do horário'; })(),
   quando: fora.length,
   c:'Atividade lançada antes das '+c.jornadaIni+' ou depois das '+c.jornadaFim+'. '
     +'Pode ser dedicação, pode ser sobrecarga, e pode ser CRM sendo preenchido de madrugada em vez '
     +'de na hora da conversa. Os três casos merecem conversa, por motivos diferentes.',
   a:'Abra por pessoa e veja o padrão. Um dia solto não diz nada; toda semana no mesmo horário diz.',
   porPessoa: () => {
    const g = {};
    fora.forEach(d=>{ const o = g[d.quem] = g[d.quem] || {quem:d.quem, dias:0, ativ:0,
      maisCedo:99999, maisTarde:0, det:[]};
     o.dias++; o.ativ += d.cedo.length + d.tarde.length;
     o.maisCedo = Math.min(o.maisCedo, d.primeira); o.maisTarde = Math.max(o.maisTarde, d.ultima);
     o.det.push(d); });
    return Object.values(g).sort((a,b)=>b.ativ-a.ativ);
   }},

  {id:'jornada_almoco', n:'medio',
   t: (()=>{ const q = new Set(semInt.map(d=>d.quem)).size;
      return q+(q===1?' pessoa ficou':' pessoas ficaram')+' sem intervalo de '+c.almocoMin+' min'; })(),
   quando: semInt.length,
   c:'Dias em que a pessoa registrou atividade da manhã à tarde sem nenhuma pausa de pelo menos '
     +c.almocoMin+' minutos entre uma e outra. É indício, não prova: só mostra que não houve '
     +'registro no intervalo, e a pessoa pode ter almoçado sem lançar nada.',
   a:'Confirme com a pessoa antes de tratar como jornada sem descanso.',
   porPessoa: () => {
    const g = {};
    semInt.forEach(d=>{ const o = g[d.quem] = g[d.quem] || {quem:d.quem, dias:0, ativ:0,
      maisCedo:99999, maisTarde:0, det:[]};
     o.dias++; o.ativ += d.itens.length;
     o.maisCedo = Math.min(o.maisCedo, d.primeira); o.maisTarde = Math.max(o.maisTarde, d.ultima);
     o.det.push(d); });
    return Object.values(g).sort((a,b)=>b.dias-a.dias);
   }},

  {id:'sem_dono', n:'critico', t:nf(semDono.length)+' negócios sem pessoa vinculada',
   quando: semDono.length,
   c:'Sem pessoa não existe telefone. Não dá para ligar, não dá para cobrar, e o negócio ocupa '
     +'lugar no funil sem poder avançar.',
   a:'Vincular a pessoa no Pipedrive ou marcar como perdido.',
   lista: () => semDono},

function tabela(host, rows, cols, vazio, rotulo){
 let ord = {k:cols[0].k, dir:1}, termo='', lim=150;
 const box = el('<div></div>');
 const tools = el('<div class="tools"><input class="search" type="search" placeholder="Buscar…" aria-label="Buscar">'
  +'<select class="selord so-mob" aria-label="Ordenar por">'
  + cols.map(c=>'<option value="'+c.k+'">'+c.h+'</option>').join('')
  +'</select><span class="mini" data-cnt></span></div>');
 const scroll = el('<div class="scroll"></div>');
 box.append(tools, scroll);
 host.append(box);
 const inp = tools.querySelector('input'), cnt = tools.querySelector('[data-cnt]');
 const so = tools.querySelector('select');
 inp.oninput = () => { termo = inp.value.toLowerCase(); lim=150; pinta(); };
 so.onchange = () => { const c = cols.find(z=>z.k===so.value);
  ord = {k: so.value, dir: typeof rows[0][so.value]==='number' ? -1 : 1}; pinta(); };

 function pinta(){
  let r = rows.filter(x => !termo || cols.some(c => String(x[c.k]).toLowerCase().includes(termo)));
  r = [...r].sort((a,b)=>{
   const A=a[ord.k], B=b[ord.k];
   return (typeof A==='number' ? A-B : String(A).localeCompare(String(B),'pt-BR')) * ord.dir;
  });
  const rot = rotulo || 'registros';
  cnt.textContent = r.length===rows.length ? nf(rows.length)+' '+rot : nf(r.length)+' de '+nf(rows.length);
  const total = r.length;
  const visiveis = r.slice(0, lim);
  if(!r.length){ scroll.innerHTML = '<div class="empty">'+esc(vazio||'Nada encontrado com esse termo.')+'</div>'; return; }
  scroll.innerHTML = '<table><thead><tr>' + cols.map(c =>
     '<th class="'+(c.r?'r ':'')+(ord.k===c.k?'sorted '+(ord.dir<0?'desc':''):'')+'" data-k="'+c.k+'">'+c.h+'</th>').join('')
   + '</tr></thead><tbody>' + visiveis.map(x => '<tr>' + cols.map((c,ci) =>
     '<td class="'+(c.r?'r':'')+(ci===0?' td1':'')+'" data-l="'+esc(c.h)+'">'
     +(c.f? c.f(x) : esc(x[c.k]))+'</td>').join('') + '</tr>').join('')
   + '</tbody></table>';
  if(total > lim){
   const mais = el('<button class="btn ghost maisbtn">Mostrar mais '
     + Math.min(150, total-lim) + ' de ' + nf(total-lim) + ' restantes</button>');
   mais.onclick = () => { lim += 150; pinta(); };
   scroll.append(mais);
  }
  scroll.querySelectorAll('button.lnk').forEach(b => b.onclick = () =>
   abrirHistorico(b.dataset.id, b.dataset.t));
  scroll.querySelectorAll('th').forEach(th => th.onclick = () => {
   const k = th.dataset.k;
   ord = { k, dir: ord.k===k ? -ord.dir : (typeof rows[0][k]==='number' ? -1 : 1) };
   so.value = k; pinta();
  });
 }
 pinta();
}

const objetivosDe = n => (dados.okrs||[]).filter(o=>o.quem===n)
  .sort((a,b)=> (a.prazo||'9999') < (b.prazo||'9999') ? -1 : 1);
const objetivosAbertos = () => (dados.okrs||[])

function diagnostico(n){
 const p = V.pessoas[n], r = realDe(p);
 const negs = V.negocios.filter(x=>x.d===n);
 const semNota = p.negocios.filter(x=>!x.s).length;
 const C = cadenciaDe(V.A.filter(x=>x.a===n));
 const umToque = C.filter(x=>x.n===1).length;
 const out = [];
 if(!p.total) return [['Sem atividade registrada no período. Não há o que avaliar — o problema é registro, não desempenho.','ruim']];
 out.push([p.tocados+' negócios trabalhados em '+p.dias+' dias ativos, '
   +(p.tocados/Math.max(p.dias,1)).toFixed(1)+' por dia', 'neutro']);
 out.push([Math.round(r/p.total*100)+'% das atividades foram contato real', r/p.total>=.7?'bom':'ruim']);
 if(C.length) out.push([Math.round(umToque/C.length*100)+'% dos negócios receberam um único contato',
   umToque/C.length<=.2?'bom':'ruim']);
 if(p.negocios.length) out.push([semNota+' de '+p.negocios.length+' negócios sem uma linha escrita',
   semNota/p.negocios.length<=.2?'bom':'ruim']);
 if(negs.length) out.push([negs.filter(x=>x.temp==='quente').length+' negócios quentes na carteira de '
   +negs.length, negs.filter(x=>x.temp==='quente').length>0?'bom':'ruim']);
 const g = D.resultado.filter(x=>noEscopo(x) && x.d===n && x.r==='ganho').length;
 out.push([g? g+' ganhos no histórico' : 'nenhum ganho registrado no histórico', g?'bom':'ruim']);
 return out;
}

function raioX(n){
 const [si,sf] = semanaAtual(), [mi,mf] = mesAtual();
 const p = V.pessoas[n], r = realDe(p);
 const carteira = V.negocios.filter(x=>x.d===n);
 const uns = (dados.reunioes||[]).filter(x=>x.tipo==='1a1' && (x.pessoas||[]).includes(n))
   .sort((a,b)=> a.data < b.data ? 1 : -1);
 const objs = objetivosDe(n).filter(o=>o.status!=='concluido' && (o.objetivo||'').trim());
 const comp = (dados.reunioes||[]).flatMap(x=>(x.comp||[])
   .filter(c=>!c.feito && c.quem===n));
 return {
  n, frente: frenteDe(n),
  sem: pontosDe(n, si, sf), mes: pontosDe(n, mi, mf),
  metaSem: metaPontos(n).semana||0, metaMes: metaPontos(n).mes||0,
  ativ: p.total, real: r, tocados: p.tocados, dias: p.dias,
  carteira: carteira.length,
  quentes: carteira.filter(x=>x.temp==='quente').length,
  semContato: carteira.filter(x=>!x.r0).length,
  ganhos: D.resultado.filter(x=>noEscopo(x) && x.d===n && x.r==='ganho').length,
  ultimo1a1: uns[0] ? uns[0].data : null,
  desde1a1: uns[0] ? dif(uns[0].data, HOJE) : null,
  objetivos: objs.length,
  objAtrasados: objs.filter(o=>o.prazo && o.prazo < HOJE).length,
  compAbertos: comp.length,
  compAtrasados: comp.filter(c=>c.quando && c.quando < HOJE).length,
  pauta: ((dados.pauta||{})[n]||[]).filter(t=>!t.usado && (t.texto||'').trim()).length,
 };
}

function viewPessoas(m){
 dados.pdi = dados.pdi || {};
 const ativos = NOMES.filter(ativo), sairam = NOMES.filter(n=>!ativo(n));
 const X = ativos.map(raioX);
 const [si,sf] = semanaAtual();

 m.append(el('<p class="lede">O time de <b>'+esc(EMP.nome)+'</b> lado a lado. '
  +'A semana corrente vai de '+dbr(si)+' a '+dbr(sf)+'. Toque numa pessoa para abrir o quadro dela.</p>'));

 /* --- o que precisa da sua atenção --- */
 const atencao = [];
 X.forEach(x=>{
  if(x.desde1a1 === null) atencao.push([x.n, 'nunca teve 1:1 registrado', 'ruim']);
  else if(x.desde1a1 > 30) atencao.push([x.n, 'sem 1:1 há '+x.desde1a1+' dias', 'ruim']);
  if(x.objAtrasados) atencao.push([x.n, x.objAtrasados+' objetivo'+(x.objAtrasados>1?'s':'')
    +' com prazo vencido', 'ruim']);
  if(x.compAtrasados) atencao.push([x.n, x.compAtrasados+' combinado'+(x.compAtrasados>1?'s':'')
    +' fora do prazo', 'ruim']);
  if(x.metaSem && x.sem.total < x.metaSem*0.5)
   atencao.push([x.n, 'com '+Math.round(x.sem.total/x.metaSem*100)+'% da meta da semana', 'ruim']);
  if(!x.ativ) atencao.push([x.n, 'sem nenhuma atividade no período', 'ruim']);

function blocoObjetivos(host, n){
 host.append(el('<p class="mini">Objetivo com resultado medível e prazo. O progresso é você quem move.</p>'));

  if(!l.length) okx.append(el('<div class="empty">Nenhum objetivo definido para '+esc(n)+'.</div>'));
  l.forEach(o=>{
   const atras = o.prazo && o.prazo < HOJE && o.status!=='concluido';
   const li = el('<div class="okr'+(o.status==='concluido'?' feito':'')+'">'
    +'<input class="search oko" placeholder="Objetivo">'
    +'<input class="search okk" placeholder="Como saber que foi atingido">'
    +'<div class="okb"><input type="date" class="search okp" style="max-width:150px">'

    +'<span class="okv num"></span><button class="btn ghost sm" data-del>Remover</button></div></div>');
   const ob=li.querySelector('.oko'), kk=li.querySelector('.okk'), pz=li.querySelector('.okp'),
         rg=li.querySelector('.okr-r'), vv=li.querySelector('.okv');
   ob.value=o.objetivo||''; kk.value=o.kr||''; pz.value=o.prazo||''; rg.value=o.progresso||0;
   const mostra = () => { vv.textContent=(o.progresso||0)+'%'; vv.className='okv num'+(atras?' warn':''); };
   ob.oninput=()=>{o.objetivo=ob.value; salvar();};
   kk.oninput=()=>{o.kr=kk.value; salvar();};
   pz.onchange=()=>{o.prazo=pz.value; salvar(); pinta();};
   rg.oninput=()=>{o.progresso=+rg.value; o.status=+rg.value>=100?'concluido':'em_andamento';
     mostra(); salvar();};
   li.querySelector('[data-del]').onclick=()=>{
    paraLixeira('objetivo', o, (o.objetivo||'sem título')+' — '+n);
    dados.okrs=(dados.okrs||[]).filter(z=>z!==o); salvar(); pinta();};
   mostra(); okx.append(li);
  });
  const add = el('<button class="btn ghost sm" style="margin-top:8px">Adicionar objetivo</button>');
  add.onclick = () => { dados.okrs = dados.okrs||[];
   dados.okrs.push({id:'o'+Date.now(), quem:n, objetivo:'', kr:'', prazo:'', progresso:0,
     status:'em_andamento'}); salvar(); pinta(); };
  okx.append(add);
 };
 pinta();
}

/* Ideia do Lattice: a pauta do 1:1 não nasce na hora da reunião. Ela é
   construída entre uma e outra, pelos dois lados. E o feedback fica registrado
   com data, senão vira memória seletiva na hora da avaliação. */
function blocoPauta(host, n){
 dados.pauta = dados.pauta || {};
 dados.pauta[n] = dados.pauta[n] || [];
 host.append(el('<h4 class="sec">Pauta do próximo 1:1</h4>'));
 host.append(el('<p class="mini">Anote durante a semana, enquanto acontece. Na reunião você só passa '
  +'a lista — é o que impede o 1:1 de virar conversa sobre o que lembrou na hora.</p>'));
 const px = el('<div></div>'); host.append(px);
 const pinta = () => {
  px.innerHTML='';
  const l = dados.pauta[n].filter(x=>!x.usado);
  if(!l.length) px.append(el('<div class="empty">Nada anotado ainda.</div>'));
  l.forEach(t=>{
   const li = el('<div class="comp">'
    +'<button class="chk" title="Já conversamos">'+(t.usado?'✓':'')+'</button>'
    +'<div class="cp"><input class="search cpo" placeholder="Assunto para levar">'
    +'<div class="cpb"><span class="mini">anotado em '+dbr(t.criado)+'</span>'
    +'<span class="tag '+(t.de==='eu'?'t-teal':'t-ochre')+'">'+(t.de==='eu'?'meu':'dele')+'</span></div></div>'
    +'<button class="btn ghost sm" data-del>Remover</button></div>');
   const o=li.querySelector('.cpo'); o.value=t.texto||'';
   o.oninput=()=>{ t.texto=o.value; salvar(); };
   li.querySelector('.chk').onclick=()=>{ t.usado=HOJE; salvar(); pinta(); };
   li.querySelector('[data-del]').onclick=()=>{
    dados.pauta[n]=dados.pauta[n].filter(z=>z!==t); salvar(); pinta(); };
   px.append(li);
  });
  const ac = el('<div class="actions" style="padding-top:10px">'
   +'<button class="btn ghost sm" data-meu>Assunto meu</button>'
   +'<button class="btn ghost sm" data-dele>Assunto dele</button></div>');
  ac.querySelector('[data-meu]').onclick = () => { dados.pauta[n].push({texto:'', de:'eu',
    criado:HOJE}); salvar(); pinta(); };
  ac.querySelector('[data-dele]').onclick = () => { dados.pauta[n].push({texto:'', de:'ele',
    criado:HOJE}); salvar(); pinta(); };
  px.append(ac);
 };
 pinta();
}

const ORDEM_ETAPA = {'Lead':1,'Lead novo':1,'Em contato':2,'Realizando contato':2,'Prospecção':2,
 'Contato Realizado':3,'Respondeu':3,'Qualificado':4,'Qualificados':4,'Follow-up':2,
 'Mídia Kit':5,'Análise Documentação':5,'Apresentando oportunidades':5,'Visita':6,'Portfólio':6,
 'Proposta':7,'Fechamento':8,'Fechado':9,'Nutrição':10,'Longo prazo':10,'Longo Prazo':10,
 'Sem interesse':11,'Arquivado':11,'Não respondeu - IA':11,'Sem número':11};
const FUNIS = ['Vendas','SDR','Painéis','Angariação'];

/* Cada empresa é um conjunto de funis. Nada é somado entre elas por acidente:
   negócios, atividades, pessoas, resultado e alertas ficam dentro do escopo. */
const EMPRESAS = [
 {id:'izi',     nome:'Izi Imóveis', funis:['Vendas','SDR','Angariação']},
 {id:'paineis', nome:'BJ7 Painéis', funis:['Painéis']},
 {id:'grupo',   nome:'Grupo',       funis:FUNIS},
];
let EMP = EMPRESAS[0];
const noEscopo = x => EMP.funis.includes(x.f);

/* de qual empresa é cada negócio, para classificar as atividades */
const EMP_DO_NEGOCIO = {};
[...D.negocios, ...D.resultado].forEach(x=>{
 const e = EMPRESAS.find(z=>z.id!=='grupo' && z.funis.includes(x.f));
 if(e) EMP_DO_NEGOCIO[x.id] = e.id;
});
/* atividade sem negócio herda a empresa onde a pessoa mais trabalha */
const EMP_DA_PESSOA = (() => {
 const c = {};
 [...D.negocios, ...D.resultado].forEach(x=>{ const e = EMP_DO_NEGOCIO[x.id]; if(!e || !x.d) return;
  (c[x.d] = c[x.d] || {})[e] = ((c[x.d]||{})[e]||0)+1; });
 const out = {};
 Object.entries(c).forEach(([n,m])=>{
  out[n] = Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0]; });
 return out;
})();
const ativNoEscopo = a => EMP.id==='grupo' ? true
  : a.i ? EMP_DO_NEGOCIO[a.i] === EMP.id
        : EMP_DA_PESSOA[a.a] === EMP.id;
const noPeriodo  = x => x.q  >= PER.ini && x.q  <= PER.fim;   /* fechado no período */
const criadoNoPer = x => x.cr >= PER.ini && x.cr <= PER.fim;   /* aberto no período */

function totais(){
 const R = D.resultado.filter(noEscopo);
 const g  = R.filter(x=>x.r==='ganho' && noPeriodo(x));
 const pc = R.filter(x=>x.r==='perdido' && !x.op && noPeriodo(x));
 const po = R.filter(x=>x.r==='perdido' && x.op && noPeriodo(x));
 const novos = D.negocios.filter(x=>noEscopo(x)&&criadoNoPer(x)).length
             + R.filter(criadoNoPer).length;
 return {novos, carteira: D.negocios.filter(noEscopo).length, g:g.length, pc:pc.length, po:po.length,
   conv: (g.length+pc.length) ? g.length/(g.length+pc.length)*100 : null};
}
function porFunil(){
 return EMP.funis.map(f=>{
  const noF = x => x.f===f;
  const g  = D.resultado.filter(x=>noF(x) && x.r==='ganho' && noPeriodo(x)).length;
  const pc = D.resultado.filter(x=>noF(x) && x.r==='perdido' && !x.op && noPeriodo(x)).length;
  const po = D.resultado.filter(x=>noF(x) && x.r==='perdido' && x.op && noPeriodo(x)).length;
  const novos = D.negocios.filter(x=>noF(x) && criadoNoPer(x)).length
              + D.resultado.filter(x=>noF(x) && criadoNoPer(x)).length;
  const cart = D.negocios.filter(noF).length;
  return {f, novos, cart, g, pc, po, conv:(g+pc)? g/(g+pc)*100 : null};
 }).sort((a,b)=>b.cart-a.cart);
}

/* ---------------- gráfico do mês ---------------- */
/* Em 600 dias, uma barra por dia vira poeira. Acima de 90 dias o gráfico passa
   a agregar por semana; acima de 400, por mês. A leitura muda junto. */
function granularidade(){
 const n = dif(PER.ini, PER.fim) + 1;
 return n <= 90 ? 'dia' : n <= 400 ? 'semana' : 'mes';
}
function agrupaSerie(n){
 const g = granularidade();
 const dts = V.diario.datas, v = V.diario.p[n].neg, fds = V.diario.fds;
 if(g === 'dia') return {g, rotulos:dts, valores:v, fds,
   titulo:'Uma barra por dia. Fim de semana em faixa cinza.'};
 const balde = {};
 dts.forEach((d,i)=>{
  let k;
  if(g==='semana'){ const dd = new Date(d+'T12:00:00');
   dd.setDate(dd.getDate() - ((dd.getDay()+6)%7)); k = dd.toISOString().slice(0,10); }
  else k = d.slice(0,7);
  balde[k] = (balde[k]||0) + v[i];
 });
 const ks = Object.keys(balde).sort();
 return {g, rotulos:ks, valores:ks.map(k=>balde[k]), fds:ks.map(()=>false),
   titulo: g==='semana' ? 'Uma barra por semana, somando os negócios trabalhados em cada uma.'
     : 'Uma barra por mês, somando os negócios trabalhados no mês.'};
}

function grafico(host, metrica){
 NOMES.forEach(n=>{
  const S = agrupaSerie(n);
  const max = Math.max(1, ...NOMES.map(z=>Math.max(...agrupaSerie(z).valores, 0)));
  const p = V.pessoas[n];
  const bloco = el('<div class="chart"><div class="lbl"><span class="nm">'+n+'</span>'

   +p.dias+' dias com registro</span></div></div>');
  const barras = el('<div class="dias"></div>');
  const leitura = el('<div class="leitura"></div>');
  const detalhe = el('<div></div>');
  const vazios = S.valores.filter((y,i)=>!y && !S.fds[i]).length;
  const base = S.g==='dia'
   ? '<span class="lg"><i class="lg-u"></i>dia útil</span>'
     +'<span class="lg"><i class="lg-f"></i>fim de semana</span> — '
     + (vazios ? '<b>'+vazios+'</b> dia'+(vazios>1?'s':'')+' útil'+(vazios>1?'eis':'')
        +' sem registro. Toque numa barra.' : 'nenhum dia útil em branco. Toque numa barra.')
   : S.rotulos.length+(S.g==='semana'?' semanas':' meses')+' no período. Toque numa barra para abrir.';
  leitura.innerHTML = base;

  S.valores.forEach((y,i)=>{
   const h = y ? Math.max(y/max*100, 4) : 3;
   const rot = S.g==='dia' ? dbr(S.rotulos[i])

   const b = el('<button class="dia'+(y?'':' zero')+(S.fds[i]?' fds':'')+'" '
     +'aria-label="'+esc(rot)+': '+y+'"><span class="b" style="height:'+h+'%"></span></button>');
   b.onclick = () => {
    const ja = b.classList.contains('sel');

    detalhe.innerHTML='';

          return d.toISOString().slice(0,10); })()

    const doPer = V.A.filter(x=>x.a===n && x.q>=de && x.q<=ate);

      + (doPer.length ? negs+' negócios em '+doPer.length+' atividades'

    if(doPer.length){
     tabela(detalhe, doPer.map(x=>({...x, cl:(fichaDe(x.i)||{}).cl||''})), [

      +'</span>').join('') + '</div>');

  host.append(bloco);
 });
}

/* ---------------- histórico do negócio ---------------- */
function fichaDe(id){
 return D.negocios.find(x=>String(x.id)===String(id))
     || D.resultado.find(x=>String(x.id)===String(id)) || null;
}

function abrirHistorico(id, titulo){
 const f = fichaDe(id);
 const itens = D.ativ.filter(x => String(x.i)===String(id));
 const cli = f && f.cl ? f.cl : '';
 const tel = f && f.tel ? f.tel : '';
 const telLimpo = tel.replace(/\D/g,'');

 let topo = '';
 if(f){
  const linhas = [];
  if(f.e) linhas.push(['Etapa', esc(f.e) + (f.f? ' · '+esc(f.f) : '')]);
  if(f.d) linhas.push(['Responsável', esc(f.d)]);
  if(f.temp) linhas.push(['Temperatura',
    '<span class="temp '+f.temp+'"></span>'+f.temp+(f.p!=null? ', parado há '+f.p+' dias':'')]);
  if(f.r) linhas.push(['Resultado', f.r==='ganho' ? 'ganho em '+f.q.slice(8,10)+'/'+f.q.slice(5,7)+'/'+f.q.slice(0,4)
    : 'perdido em '+f.q.slice(8,10)+'/'+f.q.slice(5,7)+'/'+f.q.slice(0,4)+(f.cat? ' — '+esc(f.cat):'')]);
  if(f.m) linhas.push(['Motivo', esc(f.m)]);
  if(f.c!=null && f.r) linhas.push(['Ciclo', f.c+' dias da abertura ao fechamento']);
  if(f.n!=null && !f.r) linhas.push(['No período', f.n+' atividades, '+f.r0+' contatos']);
  topo = '<div class="ficha">' + linhas.map(([k,v])=>
    '<div class="fl"><span>'+k+'</span><div>'+v+'</div></div>').join('') + '</div>';
 }

 const cab = '<h3>'+esc(titulo)+'</h3>'
  + (cli ? '<p class="cliente">'+esc(cli)
      + (tel ? ' <a class="tel" href="tel:'+telLimpo+'">'+esc(tel)+'</a>' : '') + '</p>'
     : '<p class="cliente sem">Nenhuma pessoa vinculada a este negócio</p>')

/* ---------------- leitura das conversas ---------------- */
const SINAL_BOM = [
 [/(propost|or[çc]amento|m[íi]dia kit|contrato|minuta)/i, 3, 'proposta ou documento em jogo'],
 [/(reuni[ãa]o|visita|vamos marcar|agendad|marcar)/i, 3, 'reunião ou visita combinada'],
 [/(interessad|tem interesse|gostou|quer (comprar|alugar|investir|fechar))/i, 3, 'interesse declarado'],
 [/(aguardando|vai (retornar|responder|analisar)|ficou de)/i, 2, 'ficou de retornar'],
 [/(negociar|desconto|condi[çc][ãa]o|valor|pre[çc]o)/i, 2, 'conversa chegou no preço'],
 [/(document|matr[íi]cula|cpf|certid[ãa]o|escritura)/i, 2, 'documentação em andamento'],
];
const SINAL_RUIM = [
 [/(sem interesse|n[ãa]o tem interesse|n[ãa]o quer|desist|j[áa] comprou|j[áa] resolvi)/i, -6, 'disse não'],
 [/(n[ãa]o respond|sem retorno|n[ãa]o atende|sumiu)/i, -3, 'parou de responder'],
 [/(depois|mais para frente|ano que vem|sem pressa|longo prazo)/i, -2, 'empurrou para frente'],
];

function lerNegocio(x, ativs) {
 const notas = ativs.filter(a => a.i === x.id && a.n)
   .sort((a,b)=> a.q+a.h < b.q+b.h ? 1 : -1);
 const texto = notas.map(a=>a.n).join(' — ');
 const motivos = [];
 let p = 0;
 SINAL_BOM.forEach(([re,peso,rot])=>{ if(re.test(texto)){ p += peso; motivos.push(['+',rot]); } });
 SINAL_RUIM.forEach(([re,peso,rot])=>{ if(re.test(texto)){ p += peso; motivos.push(['-',rot]); } });
 if(x.av){ p += 4; motivos.push(['+','está em etapa avançada: '+x.e]); }
 if(x.r0 >= 3){ p += 2; motivos.push(['+', x.r0+' contatos reais no período']); }
 else if(x.r0 === 0){ p -= 3; motivos.push(['-','nenhum contato real no período']); }
 if(x.p <= 7){ p += 3; motivos.push(['+','falado há '+x.p+' dias']); }
 else if(x.p > 30){ p -= 4; motivos.push(['-','parado há '+x.p+' dias']); }
 if(!notas.length){ p -= 3; motivos.push(['-','ninguém escreveu nada']); }
 if(MORTAS.includes(x.e)){ p -= 6; motivos.push(['-','etapa de descarte: '+x.e]); }
 return { ...x, nota: Math.max(0, Math.min(20, p + 6)),
   resumo: notas.length ? notas[0].n : '', historico: notas, motivos };
}

function cadenciaDe(A){
 const g = {};
 A.forEach(x=>{
  if(!x.i) return;
  const o = g[x.i] = g[x.i] || {id:x.i, t:x.d, datas:[], canais:{}, notas:0, r:0};
  o.datas.push(x.q);
  if(REAL.includes(x.t)) o.r++;
  o.canais[x.t] = (o.canais[x.t]||0)+1;
  if(x.n) o.notas++;
 });
 return Object.values(g).map(o=>{
  o.datas.sort();
  const pri = o.datas[0], ult = o.datas[o.datas.length-1];
  const vao = dif(pri, ult);
  const f = fichaDe(o.id) || {};
  return {...o, n:o.datas.length, pri, ult,
   int: o.datas.length>1 ? Math.round(vao/(o.datas.length-1)) : null,
   desde: dif(ult, PER.fim),
   cl: f.cl||'', tel:f.tel||'', e:f.e||'', fu:f.f||'', d:f.d||'',
   ch: Object.entries(o.canais).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(', ')};
 }).sort((a,b)=>b.n-a.n);
}

/* Financeiro do grupo.
   O lançamento é único e nasce no grupo. Cada empresa vê a parte dela — a
   inteira, quando é só dela, ou o rateio, quando o custo é compartilhado.
   Assim não existem dois números: existe um lançamento e várias vistas.      */
const OPERACOES = [
 {id:'izi',     nome:'Izi Imóveis'},
 {id:'paineis', nome:'BJ7 Painéis'},

const OP_DA_EMPRESA = {izi:'izi', paineis:'paineis'};

/* A planilha manda. Enquanto ela não estiver ligada, vale o que foi digitado
   aqui — mas o painel diz de onde veio, sempre. */
const FIN_EXTERNO = () => !!(D.sheets && D.sheets.ligado && (D.sheets.lancamentos||[]).length);
const lancamentos = () => FIN_EXTERNO() ? D.sheets.lancamentos : (dados.lancamentos || []);
/* quanto deste lançamento pertence a uma operação */
function parteDe(l, opId){
 if(!opId) return +l.valor || 0;
 const r = l.rateio || {};
 if(Object.keys(r).length) return (+l.valor||0) * ((+r[opId]||0)/100);
 return l.op === opId ? (+l.valor||0) : 0;
}
const somaRateio = l => Object.values(l.rateio||{}).reduce((a,b)=>a+(+b||0),0);
const opAtual = () => OP_DA_EMPRESA[EMP.id] || null;   /* null = grupo */
const lancDaVista = () => {
 const op = opAtual();
 return lancamentos().filter(l => !op || parteDe(l, op) !== 0);
};
const CATEGORIAS_FIN = ['Comissão','Salário e encargos','Aluguel','Marketing','Fornecedor',
 'Imposto','Software','Veículo','Manutenção','Pró-labore','Empréstimo','Outros'];

 dados.lancamentos = dados.lancamentos || [];
 const op = opAtual();
 const L = lancDaVista();
 const noPer = l => (l.competencia||'') >= PER.ini && (l.competencia||'') <= PER.fim;
 const doPeriodo = L.filter(noPer);
 const ent = doPeriodo.filter(l=>l.tipo==='entrada');
 const sai = doPeriodo.filter(l=>l.tipo==='saida');
 const somaE = ent.reduce((a,l)=>a+parteDe(l,op),0);

/* como cada módulo se organiza e o que ele mostra em cima —
   contas por mês, documentos por vencimento, tarefas por situação */
const AGRUPAR = {
 tarefas:      {padrao:'status', ops:[['status','Situação'],['responsavel','Quem faz'],
                 ['prioridade','Prioridade'],['','Sem agrupar']]},
 contas:       {padrao:'mes', ops:[['mes','Mês do vencimento'],['categoria','Categoria'],
                 ['status','Situação'],['','Sem agrupar']]},
 juridico:     {padrao:'status', ops:[['status','Situação'],['tipo','Tipo'],['','Sem agrupar']]},
 marketing:    {padrao:'status', ops:[['status','Situação'],['canal','Canal'],['','Sem agrupar']]},
 documentos:   {padrao:'mes', ops:[['mes','Mês do vencimento'],['tipo','Tipo'],
                 ['responsavel','Quem cuida'],['','Sem agrupar']]},
 procedimentos:{padrao:'eixo', ops:[['eixo','Eixo'],['frequencia','Frequência'],
                 ['responsavel','Dono'],['','Sem agrupar']]},
};
const MES_LONGO = {'01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho',
 '07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'};

/* Tarefa não é registro de cadastro: é fila de trabalho. Por isso ela tem tela
   própria, organizada por urgência — que é como a pessoa realmente decide o que
   fazer agora — e não por campo de banco. */
/* Entende a frase inteira: "ligar pro cartório amanhã Nicolas alta" já sai com
   prazo, dono e prioridade. Digitar uma linha tem que bastar — abrir formulário
   para três campos é o que faz ninguém cadastrar tarefa nenhuma. */
const DIAS_SEMANA = {domingo:0, segunda:1, terca:2, terça:2, quarta:3, quinta:4,
  sexta:5, sabado:6, sábado:6};
function somaDias(n){
 const d = new Date(HOJE+'T12:00:00'); d.setDate(d.getDate()+n);
 return d.toISOString().slice(0,10);
}
function proximoDiaDaSemana(alvo){
 const hoje = new Date(HOJE+'T12:00:00').getDay();
 let delta = (alvo - hoje + 7) % 7;
 if(delta === 0) delta = 7;
 return somaDias(delta);
}
function interpretar(txt){
 let t = ' ' + txt + ' ';
 const achou = {};
 const tira = re => { t = t.replace(re, ' '); };
 const sem = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

 /* prazo */
 const regras = [
  [/\bhoje\b/i,                 () => HOJE],
  [/\bdepois de amanh[ãa]/i,    () => somaDias(2)],
  [/\bamanh[ãa]/i,              () => somaDias(1)],
  [/\bem (\d{1,2}) dias?\b/i,   m => somaDias(+m[1])],
  [/\b(semana que vem|pr[óo]xima semana)/i, () => somaDias(7)],
  [/\bfim do m[êe]s/i, () => new Date(+HOJE.slice(0,4), +HOJE.slice(5,7), 0)
      .toISOString().slice(0,10)],
  [/(?:\b(?:n[oa] )?dia )?\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, m => {
     const ano = m[3] ? (m[3].length===2 ? '20'+m[3] : m[3]) : HOJE.slice(0,4);
     const d = ano+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
     return d < HOJE && !m[3] ? (+ano+1)+d.slice(4) : d; }],
 ];
 for(const [re, fn] of regras){
  const m = t.match(re);
  if(m){ achou.prazo = fn(m); tira(re); break; }
 }
 if(!achou.prazo){
  /* dia da semana: compara sem acento, mas remove do texto original */
  const palavras = t.split(/\s+/);
  for(let i=0;i<palavras.length;i++){
   const limpa = sem(palavras[i]).replace(/-feira$/,'');
   if(DIAS_SEMANA[limpa] !== undefined){
    achou.prazo = proximoDiaDaSemana(DIAS_SEMANA[limpa]);
    palavras[i] = ''; 
    if(i>0 && /^(na|a|essa|esta|proxima|próxima)$/i.test(sem(palavras[i-1]))) palavras[i-1]='';
    t = palavras.join(' ');
    break;
   }
  }
 }

 /* prioridade */
 if(/\b(urgente|alta prioridade|prioridade alta|!alta|alta)\b/i.test(t)){
  achou.prioridade = 'alta'; tira(/\b(urgente|alta prioridade|prioridade alta|!alta|alta)\b/i);
 } else if(/\b(baixa prioridade|prioridade baixa|!baixa|baixa)\b/i.test(t)){
  achou.prioridade = 'baixa'; tira(/\b(baixa prioridade|prioridade baixa|!baixa|baixa)\b/i);
 }

 /* dono */
 for(const n of NOMES){
  const re = new RegExp('(?:@)?\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');

 }

 /* sobras que só faziam sentido junto do que já foi extraído */
 t = t.replace(/(^|\s)[àa]s(\s|$)/gi, '$1$2');
 achou.titulo = t.replace(/\s+/g,' ').replace(/^[\s,;.:-]+|[\s,;.:-]+$/g,'');
 if(!achou.titulo) achou.titulo = txt.trim();
 return achou;
}

/* Tarefa que repete não deve ser recriada na mão toda semana: ao concluir,
   a próxima já nasce com o prazo empurrado. É o que mantém rotina viva. */
const PASSO_REC = {'diária':1, 'semanal':7, 'quinzenal':14, 'mensal':30};
function concluirTarefa(r){
 r.status = 'concluida';
 r.concluidaEm = HOJE;
 const passo = PASSO_REC[r.recorrencia];
 if(passo && r.prazo){
  const base = r.prazo > HOJE ? r.prazo : HOJE;
  const d = new Date(base+'T12:00:00');
  if(r.recorrencia === 'mensal') d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+passo);
  dados.registros.tarefas.unshift({...r, id:'x'+Date.now(), status:'aberta',
    concluidaEm:'', andamento:[], criado:HOJE, prazo:d.toISOString().slice(0,10)});
 }
}

function viewTarefas(m){
 dados.registros = dados.registros || {};
 dados.registros.tarefas = dados.registros.tarefas || [];
 const mod = modPor('tarefas');
 const todas = regs('tarefas');
 const abertas = todas.filter(r=>emAberto(mod,r));
 const feitas = todas.filter(r=>!emAberto(mod,r));

 const daSemana = r => r.prazo && r.prazo > HOJE && dif(HOJE, r.prazo) <= 7;
 const grupos = [
  ['Atrasadas',   r => r.prazo && r.prazo < HOJE,  true],
  ['Para hoje',   r => r.prazo === HOJE,           true],
  ['Esta semana', daSemana,                        false],
  ['Depois',      r => r.prazo && dif(HOJE, r.prazo) > 7, false],
  ['Sem prazo',   r => !r.prazo,                   false],
 ];

 let fQuem = '', fSt = 'abertas';

 if(TAREFAS_EXTERNAS()){
  m.append(el('<div class="fonte-ext"><b>Vem do Trello.</b> As tarefas são lidas do quadro e não se '
   +'edita aqui — quem manda é o Trello. A lista de lá vira a situação daqui: '
   + esc((D.trello.listas||[]).join(' · ')) + '.</div>'));
 } else if(D.trello && !D.trello.ligado){
  m.append(el('<div class="fonte-ext off"><b>Trello não conectado.</b> '
   + esc(D.trello.motivo || D.trello.erro || '') + '. Enquanto isso, o que você criar fica só aqui.</div>'));
 }
 m.append(el('<p class="lede">A fila do dia, organizada por urgência: atrasadas, hoje, esta semana. '
  +'Toque numa tarefa para ver os detalhes e abrir no Trello.</p>'));
 if(!TAREFAS_EXTERNAS()){
  m.append(el('<div class="empty">Sem dado para mostrar até o quadro ser conectado.</div>'));
  return;
 }

 const kp = el('<div></div>'); m.append(kp);
 const criar = texto => {
  const p = interpretar(texto || '');
  const novo = {id:'x'+Date.now(), emp: EMP.id==='grupo'?'grupo':EMP.id, criado:HOJE,
    titulo: p.titulo || texto || '',
    prioridade: p.prioridade || 'média',
    prazo: p.prazo || '',
    responsavel: p.responsavel || (fQuem && fQuem!=='sem' ? fQuem : ''),
    status:'aberta'};
  dados.registros.tarefas.unshift(novo); salvar();
  return novo;
 };
 if(TAREFAS_EXTERNAS() && D.trello.board){
  m.append(el('<div class="actions" style="margin-top:16px"><a class="btn" target="_blank" '
   +'rel="noopener" href="https://trello.com/b/'+esc(D.trello.board)+'">Abrir o quadro no Trello</a></div>'));
 }

 const donos = [...new Set(abertas.map(r=>r.responsavel).filter(Boolean))].sort();
 const chips = el('<div class="seg" style="flex-wrap:wrap;margin:14px 0 8px">'
  +'<button class="on" data-q="">Todas</button>'
  + donos.map(n=>'<button data-q="'+esc(n)+'">'+esc(n)+'</button>').join('')
  + (abertas.some(r=>!r.responsavel) ? '<button data-q="sem">Sem dono</button>' : '')
  +'</div>');
 const segS = el('<div class="seg" style="margin-bottom:12px">'
  +'<button class="on" data-s="abertas">Em aberto</button>'
  +'<button data-s="feitas">Concluídas</button></div>');
 const bx = el('<div></div>');
 m.append(chips, segS, bx);

 const PRIO = {'alta':'p-alta','média':'p-media','baixa':'p-baixa'};

 const pinta = () => {
  chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.q===fQuem));
  segS.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===fSt));
  const filtro = r => !fQuem ? true : fQuem==='sem' ? !r.responsavel : r.responsavel===fQuem;
  const base = (fSt==='abertas' ? abertas : feitas).filter(filtro);

  kp.innerHTML='';
  kp.append(cartoes([
   {b:base.filter(r=>r.prazo && r.prazo < HOJE && emAberto(mod,r)).length, s:'atrasadas'},
   {b:base.filter(r=>r.prazo===HOJE && emAberto(mod,r)).length, s:'para hoje'},
   {b:base.filter(daSemana).length, s:'nos próximos 7 dias'},
   {b:base.filter(r=>!r.prazo && emAberto(mod,r)).length, s:'sem prazo definido'}]));

  bx.innerHTML='';
  if(fSt==='feitas'){
   if(!base.length){ bx.append(el('<div class="empty">Nenhuma tarefa concluída ainda.</div>')); return; }
   base.sort((a,b)=>(b.prazo||'').localeCompare(a.prazo||'')).forEach(r=>item(bx,r));
   return;
  }
  let mostrou = 0;
  grupos.forEach(([rot, cond, urgente])=>{
   const l = base.filter(cond).sort((a,b)=>{
    const pr = {'alta':0,'média':1,'baixa':2};
    return (pr[a.prioridade]??1)-(pr[b.prioridade]??1)
        || (a.prazo||'9999').localeCompare(b.prazo||'9999');
   });
   if(!l.length) return;
   mostrou += l.length;
   bx.append(el('<div class="grp'+(urgente?' urg':'')+'">'+rot+'<span>'+l.length+'</span></div>'));
   l.forEach(r=>item(bx,r));
  });
  if(!mostrou) bx.append(el('<div class="empty">Nada em aberto'
   +(fQuem? ' para '+(fQuem==='sem'?'tarefas sem dono':esc(fQuem)) : '')
   +'. Escreva acima e aperte Enter.</div>'));
 };

 function item(host, r){
  const feito = !emAberto(mod,r), atr = r.prazo && r.prazo < HOJE && !feito;
  const cx = el('<div class="tarefa'+(feito?' feito':'')+'"></div>');
  const chk = el('<button class="chk" title="Concluir">'+(feito?'✓':'')+'</button>');
  chk.onclick = e => { e.stopPropagation();
   r.status = feito ? 'aberta' : 'concluida'; salvar(); render(); };
  const corpo = el('<button class="tcorpo">'
   +'<span class="prio '+(PRIO[r.prioridade]||'p-media')+'"></span>'
   +'<span class="tt">'+(r.titulo? esc(r.titulo) : '<i class="mini">sem título</i>')+'</span>'
   +'<span class="tsub">'+[
      r.responsavel ? esc(r.responsavel) : '<span class="warn">sem dono</span>',
      r.prazo ? (atr? '<span class="warn">'+dbr(r.prazo)+' · '+dif(r.prazo,HOJE)+'d atrasada</span>'
                    : dbr(r.prazo)) : 'sem prazo',
      r.prioridade==='alta' ? '<span class="warn">alta</span>' : ''
     ].filter(Boolean).join(' · ')+'</span></button>');
  cx.append(chk, corpo);
  host.append(cx);
  corpo.onclick = () => {
   const jaAberto = cx.nextElementSibling && cx.nextElementSibling.classList.contains('panel');
   host.querySelectorAll('.panel').forEach(x=>x.remove());
   if(jaAberto) return;
   const p = el('<div class="panel"></div>');
   cx.after(p);
   if(TAREFAS_EXTERNAS()){
    p.append(el('<p class="lede" style="margin-top:12px">'
     + (r.obs ? esc(r.obs)+'<br><br>' : '')
     + 'Na lista <b>'+esc(r.lista||'—')+'</b> do Trello'
     + (r.etiquetas && r.etiquetas.length ? ' · '+r.etiquetas.map(esc).join(', ') : '')
     + (r.atualizado ? ' · mexeram em '+dbr(r.atualizado) : '') + '.</p>'));
    if(r.link){
     const a = el('<div class="actions"><a class="btn ghost sm" target="_blank" rel="noopener" '
       +'href="'+esc(r.link)+'">Abrir no Trello</a></div>');
     p.append(a);
    }
    return;
   }
   mod.campos.forEach(c=> campoInput(r, c, salvar, p));
   /* andamento: o que já foi feito, com data. Tarefa que arrasta sem histórico
      vira discussão de memória na reunião. */
   p.append(el('<h4 class="sec" style="margin-top:16px">Andamento</h4>'));
   const ax = el('<div></div>'); p.append(ax);
   const pintaAnd = () => {
    ax.innerHTML='';
    (r.andamento||[]).forEach((a,i)=>{
     const li = el('<div class="and"><span class="q">'+dbr(a.q)+'</span>'
      +'<input class="search" value=""><button class="btn ghost sm" data-x>×</button></div>');
     const inp2 = li.querySelector('input'); inp2.value = a.t||'';
     inp2.oninput = () => { a.t = inp2.value; salvar(); };
     li.querySelector('[data-x]').onclick = () => { r.andamento.splice(i,1); salvar(); pintaAnd(); };
     ax.append(li);
    });
    const novo = el('<div class="addbar" style="margin-top:6px">'
     +'<input class="search" placeholder="O que avançou hoje… e Enter"></div>');
    const ni = novo.querySelector('input');
    ni.onkeydown = e => {
     if(e.key!=='Enter' || !ni.value.trim()) return;
     r.andamento = r.andamento || [];
     r.andamento.push({q:HOJE, t:ni.value.trim()});
     if(r.status==='aberta') r.status='fazendo';
     ni.value=''; salvar(); pintaAnd();
    };
    ax.append(novo);
   };
   pintaAnd();

   const ac = el('<div class="actions" style="flex-wrap:wrap">'
     +'<button class="btn ghost sm" data-hoje>Hoje</button>'
     +'<button class="btn ghost sm" data-am>Amanhã</button>'
     +'<button class="btn ghost sm" data-sem>+1 semana</button>'
     +'<button class="btn ghost sm" data-passa>Passar para…</button>'
     +'<button class="btn ghost sm" data-del>Apagar</button></div>');
   ac.querySelector('[data-hoje]').onclick = () => { r.prazo = HOJE; salvar(); render(); };
   ac.querySelector('[data-am]').onclick = () => {
    const d = new Date(HOJE+'T12:00:00'); d.setDate(d.getDate()+1);
    r.prazo = d.toISOString().slice(0,10); salvar(); render(); };
   ac.querySelector('[data-sem]').onclick = () => {
    const base = r.prazo && r.prazo > HOJE ? r.prazo : HOJE;
    const d = new Date(base+'T12:00:00'); d.setDate(d.getDate()+7);
    r.prazo = d.toISOString().slice(0,10); salvar(); render(); };
   ac.querySelector('[data-passa]').onclick = () => {
    const box = el('<div class="seg" style="flex-wrap:wrap;margin-top:8px">'
     + NOMES.map(x=>'<button data-p="'+esc(x)+'">'+esc(x)+'</button>').join('') + '</div>');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
     r.responsavel = b.dataset.p; salvar(); render(); });
    ac.after(box);
   };
   ac.querySelector('[data-del]').onclick = () => {
    paraLixeira('tarefas', r, r.titulo || 'sem título');
    dados.registros.tarefas = dados.registros.tarefas.filter(z=>z.id!==r.id); salvar(); render(); };
   p.append(ac);
  };
 }

 chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{ fQuem=b.dataset.q; pinta(); });
 segS.querySelectorAll('button').forEach(b=>b.onclick=()=>{ fSt=b.dataset.s; pinta(); });
 pinta();
}

function viewModulo(m, mid){
 dados.registros = dados.registros || {};
 dados.registros[mid] = dados.registros[mid] || [];
 const mod = modPor(mid);
 const principal = mod.campos.find(c=>c.principal) || mod.campos[0];
 avisoFonte(m, mid);
 const lista = regs(mid);
 if(!ligado(mid)){
  m.append(el('<div class="empty">Sem dado para mostrar até a fonte ser conectada.</div>'));
  return;
 }
 const abertos = lista.filter(r=>emAberto(mod,r));
 const atras = lista.filter(r=>atrasado(mod,r));

 m.append(el('<p class="lede">'+esc(mod.desc)+'</p>'));

 /* --- cabeçalho próprio de cada módulo --- */
 if(mid==='contas'){
  const porMes = {};
  abertos.forEach(r=>{ const k=(r.vencimento||'').slice(0,7)||'sem';
    porMes[k]=(porMes[k]||0)+(+r.valor||0); });
  const mm = Object.entries(porMes).filter(([k])=>k!=='sem').sort();
  const total = abertos.reduce((a,r)=>a+(+r.valor||0),0);
  const venc = atras.reduce((a,r)=>a+(+r.valor||0),0);
  m.append(cartoes([
   {b:MOEDA(total), s:'a pagar, no total'},
   {b:MOEDA(venc), s:'já vencido'},
   {b:nf(abertos.length), s:'contas em aberto'},
   {b:mm.length? MOEDA(mm[0][1]) : 'R$ 0', s: mm.length? 'vence em '+MES_LONGO[mm[0][0].slice(5)] : 'nada agendado'}]));
  if(mm.length>1){
   m.append(el('<h2>Quanto sai por mês</h2>'));
   const max = Math.max(...mm.map(([,v])=>v));
   const bx = el('<div></div>');
   mm.slice(0,8).forEach(([k,v])=>{
    bx.append(el('<div style="margin-bottom:12px"><div class="hd"><span>'
     +MES_LONGO[k.slice(5)]+' de '+k.slice(0,4)+'</span><span class="stat num">'+MOEDA(v)+'</span></div>'
     +'<div class="bar"><i style="width:'+Math.max(v/max*100,2)+'%"></i></div></div>'));
   });
   m.append(bx);
  }
 } else if(mid==='marketing'){
  const rodando = abertos.filter(r=>r.status==='rodando');
  const orc = abertos.reduce((a,r)=>a+(+r.orcamento||0),0);
  const gas = abertos.reduce((a,r)=>a+(+r.gasto||0),0);
  const lea = abertos.reduce((a,r)=>a+(+r.leads||0),0);
  m.append(cartoes([
   {b:rodando.length, s:'campanhas rodando'},
   {b:MOEDA(gas), s:'gasto de '+MOEDA(orc)+' orçado'},
   {b:nf(lea), s:'leads gerados'},
   {b:lea? MOEDA(gas/lea) : '—', s:'custo por lead'}]));
  if(abertos.length){
   m.append(el('<h2>Orçamento contra gasto</h2>'));
   const bx = el('<div></div>');
   abertos.forEach(r=>{
    const o=+r.orcamento||0, g=+r.gasto||0, pct = o? Math.min(g/o*100,100) : 0;
    bx.append(el('<div style="margin-bottom:14px"><div class="hd"><span class="nm">'
     +esc(r.nome||'sem nome')+'</span><span class="stat num'+(o&&g>o?' warn':'')+'">'
     +MOEDA(g)+' de '+MOEDA(o)+'</span></div>'
     +'<div class="sub">'+esc(r.canal||'sem canal')+(r.leads? ' · '+r.leads+' leads · '
       +MOEDA(g/r.leads)+' por lead' : ' · nenhum lead contado')+'</div>'
     +'<div class="bar"><i class="'+(o&&g>o?'':'dim')+'" style="width:'+Math.max(pct,2)+'%"></i></div></div>'));
   });
   m.append(bx);
  }
 } else if(mid==='juridico'){
  const risco = abertos.reduce((a,r)=>a+(+r.risco||0),0);
  m.append(cartoes([
   {b:abertos.length, s:'processos em andamento'},
   {b:MOEDA(risco), s:'somado em risco'},
   {b:atras.length, s:'com data já passada'},
   {b:abertos.filter(r=>!r.proxima).length, s:'sem próxima data marcada'}]));
 } else if(mid==='procedimentos'){
  const ativos = lista.filter(r=>r.status==='ativo');
  m.append(cartoes([
   {b:ativos.length, s:'procedimentos ativos'},
   {b:lista.filter(r=>r.status==='rascunho').length, s:'em rascunho'},
   {b:ativos.filter(r=>!r.responsavel).length, s:'sem dono definido'},
   {b:ativos.filter(r=>!(r.passos||'').trim()).length, s:'sem o passo a passo escrito'}]));
 } else {
  const prox = lista.filter(r=>vencendo(mod,r,15) && !atrasado(mod,r));
  m.append(cartoes([
   {b:nf(abertos.length), s:'em aberto'},
   {b:nf(atras.length), s:'com prazo vencido'},
   {b:nf(prox.length), s:'vencendo em 15 dias'},
   {b:nf(abertos.filter(r=>!r[mod.prazo]).length), s:'sem prazo definido'}]));
 }

 /* --- adicionar rápido: escreve e Enter --- */


 /* --- filtros e ordem --- */
 const ag = AGRUPAR[mid] || {padrao:'', ops:[['','Sem agrupar']]};
 let fSt = 'abertos', fAg = ag.padrao;
 const barra = el('<div class="tools" style="margin-top:14px"></div>');
 const segS = el('<div class="seg"><button class="on" data-s="abertos">Em aberto</button>'
  +'<button data-s="atraso">Atrasados</button><button data-s="todos">Todos</button></div>');
 const selAg = el('<select class="selmes" aria-label="Agrupar por">'
  + ag.ops.map(([k,r])=>'<option value="'+k+'">'+r+'</option>').join('') + '</select>');
 selAg.value = fAg;
 const busca = el('<input class="search" type="search" placeholder="Buscar…">');
 barra.append(segS, selAg, busca);
 const bx = el('<div></div>');
 m.append(barra, bx);

 const chaveGrupo = r => {
  if(!fAg) return '';
  if(fAg==='mes'){ const v=r[mod.prazo]; return v ? MES_LONGO[v.slice(5,7)]+' de '+v.slice(0,4) : 'Sem data'; }
  return r[fAg] || 'Não preenchido';
 };

 const pinta = () => {
  segS.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===fSt));
  bx.innerHTML='';
  const termo = busca.value.toLowerCase();
  const rows = lista
   .filter(r => fSt==='todos' ? true : fSt==='atraso' ? atrasado(mod,r) : emAberto(mod,r))
   .filter(r => !termo || mod.campos.some(c=>String(r[c.k]||'').toLowerCase().includes(termo)))
   .sort((a,b)=> (a[mod.prazo]||'9999') < (b[mod.prazo]||'9999') ? -1 : 1);
  if(!rows.length){
   bx.append(el('<div class="empty">Nada '+(fSt==='abertos'?'em aberto':fSt==='atraso'?'atrasado':'aqui')
    +'. Escreva acima e aperte Enter para criar o primeiro.</div>'));
   return;
  }
  const grupos = {};
  rows.forEach(r=>{ const k=chaveGrupo(r); (grupos[k]=grupos[k]||[]).push(r); });
  Object.entries(grupos).forEach(([k, itens])=>{
   if(k) bx.append(el('<div class="grp">'+esc(k)+'<span>'+itens.length
     + (mod.soma ? ' · '+MOEDA(itens.reduce((a,r)=>a+(+r[mod.soma]||0),0)) : '')+'</span></div>'));
   itens.forEach(r=>{
    const atr = atrasado(mod,r), prz = r[mod.prazo], feito = !emAberto(mod,r);
    const cx = el('<div class="item'+(feito?' feito':'')+'"></div>');
    const chk = el('<button class="chk" title="Concluir">'+(feito?'✓':'')+'</button>');
    chk.onclick = e => { e.stopPropagation();
     const cs = mod.campos.find(c=>c.k===mod.status);
     r[mod.status] = feito ? (cs.padrao || cs.op[0]) : (mod.concluido[0]);
     salvar(); render();
    };
    const corpo = el('<button class="row noborda" data-r="'+r.id+'" aria-expanded="false">'
     +'<div class="hd"><span class="nm">'
     +(r[principal.k] ? esc(r[principal.k]) : '<i class="mini">sem título</i>')+'</span>'
     +(mod.soma && r[mod.soma] ? '<span class="stat num">'+MOEDA(r[mod.soma])+'</span>' : '')+'</div>'
     +'<div class="sub">'
     + [prz ? '<span class="'+(atr?'warn':'')+'">'+dbr(prz)+(atr?' · atrasado '+dif(prz,HOJE)+'d':'')+'</span>' : 'sem prazo',
        r.responsavel||r.advogado||r.canal||r.tipo||r.eixo||'', r[mod.status]||'']
       .filter(Boolean).map(x=>x).join(' · ')
     +'</div></button>');
    cx.append(chk, corpo);
    bx.append(cx);
    corpo.onclick = () => {
     const aberto = corpo.getAttribute('aria-expanded')==='true';
     bx.querySelectorAll('.panel').forEach(p=>p.remove());
     bx.querySelectorAll('.row').forEach(z=>z.setAttribute('aria-expanded','false'));
     if(aberto) return;
     corpo.setAttribute('aria-expanded','true');
     const p = el('<div class="panel"></div>');
     cx.after(p);
     const cx2 = el('<div></div>');
     Object.entries(r).forEach(([k,v])=>{
      if(['id','origem','titulo'].includes(k) || v==='' || v===null || v===undefined) return;
      cx2.append(el('<div class="conv" style="grid-template-columns:1fr 1.4fr">'
       +'<span class="mini">'+esc(k.replace(/_/g,' '))+'</span>'
       +'<span>'+esc(String(v))+'</span></div>'));
     });
     p.append(cx2);
     p.append(el('<p class="mini" style="margin-top:12px">Vem da planilha. '
      +'Para corrigir, edite a linha lá e clique em Atualizar.</p>'));
    };
   });
  });
 };
 segS.querySelectorAll('button').forEach(b=>b.onclick=()=>{ fSt=b.dataset.s; pinta(); });
 selAg.onchange = () => { fAg = selAg.value; pinta(); };
 busca.oninput = pinta;

function pendencias(){
 const out = [];
 MODULOS.forEach(mod => regs(mod.id).forEach(r=>{
  if(!emAberto(mod,r) || !r[mod.prazo]) return;
  const p = mod.campos.find(c=>c.principal) || mod.campos[0];
  const dono = r.responsavel || r.advogado || '';
  out.push({quando:r[mod.prazo], o:r[p.k]||'(sem título)', quem:dono,
    onde:mod.nome, aba:mod.id, ir:()=>{ atual=mod.id; render(); }});
 }));
 (dados.reunioes||[]).filter(r=>EMP.id==='grupo'||r.emp===EMP.id).forEach(r=>
  (r.comp||[]).filter(c=>!c.feito && c.oque).forEach(c=>
   out.push({quando:c.quando||'', o:c.oque, quem:c.quem||'', onde:'Combinado de reunião',
     aba:'reunioes', ir:()=>{ atual='reunioes'; render(); }})));
 (dados.okrs||[]).filter(o=>o.status!=='concluido' && (o.objetivo||'').trim()
   && NOMES.filter(ativo).includes(o.quem)).forEach(o=>
  out.push({quando:o.prazo||'', o:o.objetivo, quem:o.quem, onde:'Objetivo',
    aba:'pessoas', ir:()=>{ atual='pessoas'; render(); }}));
 return out.sort((a,b)=> (a.quando||'9999') < (b.quando||'9999') ? -1 : 1);
}

   Cada cartão diz de onde vem o número. Onde a fonte ainda não está conectada,
   o painel escreve isso em vez de mostrar zero: zero e "não conectado" são
   coisas muito diferentes na hora de decidir.                                */
const FONTES = {
 izi:     {nome:'Izi Imóveis',            fonte:'Pipedrive', ok:true},
 paineis: {nome:'BJ7 Painéis',            fonte:'Pipedrive', ok:true},
 stone:   {nome:'Stone · BJ7 Consultoria',fonte:'Salesforce', ok:false},
 incorp:  {nome:'Incorporação',           fonte:'Pipedrive',  ok:false},

function metricasDaOperacao(id){
 const emp = EMPRESAS.find(e=>e.id===id);
 if(!emp) return null;
 const N = D.negocios.filter(x=>emp.funis.includes(x.f));
 const A = D.ativ.filter(x=>x.q>=PER.ini && x.q<=PER.fim
   && (x.i ? EMP_DO_NEGOCIO[x.i]===id : EMP_DA_PESSOA[x.a]===id));
 const g = D.resultado.filter(x=>emp.funis.includes(x.f) && x.r==='ganho'
   && x.q>=PER.ini && x.q<=PER.fim).length;
 const quentes = N.filter(x=>{
   const at = D.ativ.filter(z=>z.i===x.id && REAL.includes(z.t));
   const ult = at.map(z=>z.q).sort().pop();
   return x.av && ult && dif(ult, D.hoje) <= 7; }).length;
 return {carteira:N.length, ativ:A.length, ganhos:g, quentes};
}
